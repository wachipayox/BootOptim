modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Wachipayoxx"
description='''
BootOptim researches, measures, and optimizes Minecraft/NeoForge startup performance while preserving modpack compatibility.
'''

[[mixins]]
config="boot_optim.mixins.json"

# Default-off experiment config. Its plugin declines the cooperative-wait mixin unless the explicit
# experiment property is true, so stock/control FancyMenu wait bytecode is not wrapped.
[[mixins]]
config="boot_optim.experiments.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

// Branch-only dependency bridge for the Agent 144 source candidate.
// Normal BootOptim builds do not load this init script.

def overrideRepo = System.getenv('BOOTOPTIM_AT_OVERRIDE_REPO')
def overrideVersion = System.getenv('BOOTOPTIM_AT_OVERRIDE_VERSION')
if (!overrideRepo || !overrideVersion) {
    throw new GradleException('BOOTOPTIM_AT_OVERRIDE_REPO and BOOTOPTIM_AT_OVERRIDE_VERSION are required')
}

gradle.allprojects { p ->
    p.repositories {
        maven {
            name = 'agent144AccessTransformersOverride'
            url = p.uri(overrideRepo)
            content { includeGroup('dev.bootoptim.atfork') }
        }
    }
    p.configurations.configureEach { configuration ->
        configuration.resolutionStrategy.dependencySubstitution {
            substitute module('net.neoforged:accesstransformers') using module("dev.bootoptim.atfork:accesstransformers:${overrideVersion}") because 'Agent 144 exact-10.0.1 single-module AccessTransformers replacement'
        }
    }
}

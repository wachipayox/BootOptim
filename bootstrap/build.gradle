plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = rootProject.version
group = rootProject.group

base {
    archivesName = "${rootProject.mod_id}-bootstrap"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// SERVICE-layer development runs load bootstrap directly from its source-set output rather than
// from the distributable wrapper JAR. Compile the single shared trace-core source tree into that
// same output so the class identity is available in the SERVICE module in both environments.
// trace-core remains its own JDK-only library for the regular mod; there is still one source of truth.
sourceSets.main.java.srcDir(rootProject.file('trace-core/src/main/java'))

neoForge {
    version = rootProject.neo_version
    addModdingDependenciesTo sourceSets.main
    addModdingDependenciesTo sourceSets.test
}

dependencies {
    // The regular NeoForge mod remains isolated from ModLauncher's SERVICE layer and is loaded from JarJar.
    jarJar project(':')

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    // sourceSets.main already contains the shared trace source, so the normal Jar task emits those
    // classes directly in the bootstrap module; no second copy step or writer implementation exists.
    manifest {
        attributes(
                'Automatic-Module-Name': 'dev.wachipayox.bootoptim.bootstrap',
                'Implementation-Version': project.version,
                // Early-service jars cannot double as normal mods. Mark the wrapper as an FML library so
                // production discovery keeps it as a mod-file container and JarJar can expose the nested mod.
                'FMLModType': 'LIBRARY')
    }
}

// Diagnostic-only offline bytecode patch. It is never wired into normal build/startup/run tasks; the exact-pack
// warm-profile harness calls it explicitly after preparing the copied pack and before either measured JVM starts.
tasks.register('patchConnectorWarmResidual', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.wachipayox.bootoptim.bootstrap.ConnectorWarmResidualPatcher'
    args rootProject.file('run-pack-benchmark/mods').absolutePath
}

// The packaged bootstrap is the actual distributable artifact. Make a normal root `build` produce it so
// developers do not accidentally pick the inner regular-mod jar from build/libs.
rootProject.tasks.named('build').configure {
    dependsOn tasks.named('jarJar')
}

tasks.named('test', Test).configure {
    dependsOn rootProject.tasks.named('jar')
    useJUnitPlatform()
    systemProperty 'bootoptim.fixtureJar', rootProject.tasks.named('jar', Jar).flatMap { it.archiveFile }.get().asFile.absolutePath
    systemProperty 'boot_optim.version', rootProject.mod_version
    testLogging.showStandardStreams = true

    // SecureJarHandler normally receives these opens/exports from BootstrapLauncher/ModLauncher.
    // Plain JUnit runs do not, so mirror the real launch environment for the functional cache test.
    jvmArgs '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
            '--add-opens=java.base/java.util.jar=ALL-UNNAMED',
            '--add-exports=java.base/sun.security.util=ALL-UNNAMED'
}

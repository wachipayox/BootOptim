name: Agent85 Decocraft bytecode inspect

on:
  push:
    branches:
      - agent85/decocraft-base-bake-20260909

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download pinned Decocraft 3.0.11
        run: |
          curl --fail --location --retry 3 \
            'https://cdn.modrinth.com/data/IZJSgKZe/versions/Z8xm2POI/decocraft-3.0.11-1.21.1-neoforge.jar' \
            --output decocraft.jar
          sha256sum decocraft.jar | tee decocraft.sha256
      - name: Inspect Blockbench classes
        run: |
          jar tf decocraft.jar | grep '^com/razz/decocraft/models/bbmodel/' | sort | tee bbmodel-classes.txt
          javap -classpath decocraft.jar -p -c -s -l 'com.razz.decocraft.models.bbmodel.BBModelGeometryLoader$BBGeometry' > bbgeometry.javap.txt
          javap -classpath decocraft.jar -p -c -s -l 'com.razz.decocraft.models.bbmodel.BBModelGeometryLoader' > loader.javap.txt
          javap -classpath decocraft.jar -p -c -s -l 'com.razz.decocraft.models.bbmodel.BlockbenchModel' > blockbench-model.javap.txt
          cat decocraft.sha256 bbmodel-classes.txt bbgeometry.javap.txt loader.javap.txt blockbench-model.javap.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent85-decocraft-bytecode
          path: |
            decocraft.sha256
            bbmodel-classes.txt
            bbgeometry.javap.txt
            loader.javap.txt
            blockbench-model.javap.txt

name: Agent85 Decocraft bytecode inspect

on:
  push:
    branches:
      - agent85/decocraft-base-bake-20260909

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download pinned Decocraft 3.0.11
        run: |
          curl --fail --location --retry 3 \
            'https://cdn.modrinth.com/data/IZJSgKZe/versions/Z8xm2POI/decocraft-3.0.11-1.21.1-neoforge.jar' \
            --output decocraft.jar
          sha256sum decocraft.jar | tee decocraft.sha256
      - name: Inspect Blockbench classes
        run: |
          jar tf decocraft.jar | grep '^com/razz/decocraft/models/bbmodel/' | sort > bbmodel-classes.txt
          for c in \
            'com.razz.decocraft.models.bbmodel.BBModelGeometryLoader$BBGeometry' \
            'com.razz.decocraft.models.bbmodel.BBModelGeometryLoader' \
            'com.razz.decocraft.models.bbmodel.BBUnbakedModel' \
            'com.razz.decocraft.models.bbmodel.BlockbenchModel' \
            'com.razz.decocraft.models.bbmodel.BlockbenchBakery' \
            'com.razz.decocraft.models.bbmodel.BlockbenchBakery$VertexData' \
            'com.razz.decocraft.models.bbmodel.BBModel' \
            'com.razz.decocraft.models.bbmodel.BBModelParts$Element' \
            'com.razz.decocraft.models.bbmodel.BBModelParts$Face' \
            'com.razz.decocraft.models.bbmodel.BBModelParts$UVCoordinate' \
            'com.razz.decocraft.models.bbmodel.BBModelParts$Resolution' \
            'com.razz.decocraft.models.bbmodel.BBModelParts$Locator' \
            'com.razz.decocraft.models.bbmodel.BlockbenchLoader$BlockbenchSetting'
          do
            safe="$(printf '%s' "$c" | tr '$.' '__')"
            javap -classpath decocraft.jar -p -c -s -l "$c" > "$safe.javap.txt"
          done
          cat decocraft.sha256 bbmodel-classes.txt *.javap.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent85-decocraft-bytecode
          path: |
            decocraft.sha256
            bbmodel-classes.txt
            *.javap.txt

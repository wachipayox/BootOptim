name: Agent85 Decocraft bytecode inspect

on:
  push:
    branches:
      - agent85/decocraft-field-inspect-20260909

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download pinned Decocraft 3.0.11
        run: |
          curl --fail --location --retry 3 \
            'https://cdn.modrinth.com/data/IZJSgKZe/versions/Z8xm2POI/decocraft-3.0.11-1.21.1-neoforge.jar' \
            --output decocraft.jar
          sha256sum decocraft.jar | tee decocraft.sha256
      - name: Inspect Blockbench hierarchy
        run: |
          for c in \
            'com.razz.decocraft.models.bbmodel.BBModelParts$ElementBase' \
            'com.razz.decocraft.models.bbmodel.BBModelParts$Element' \
            'com.razz.decocraft.models.bbmodel.BBModelParts$Locator' \
            'com.razz.decocraft.models.bbmodel.BBModelParts$OutlinerGroup'
          do
            safe="$(printf '%s' "$c" | tr '$.' '__')"
            javap -classpath decocraft.jar -p -c -s "$c" > "$safe.javap.txt"
          done
          cat decocraft.sha256 *.javap.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent85-decocraft-field-hierarchy
          path: |
            decocraft.sha256
            *.javap.txt

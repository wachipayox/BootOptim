name: Agent 102 DataFixers Create Subphase Profile

on:
  pull_request:
    branches:
      - agent/integration-current
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: agent102-datafixers-create-subphases-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXACT_PACK_TAG: exact-pack-2026-09-02-v1
  EXACT_PACK_ASSET: bootoptim-exact-pack.zip
  EXACT_PACK_SHA256: 7f586ecd90497a4d4aa1d2024af2643dbd64691864edbad9eb2ed40551c55639
  EXACT_PACK_CACHE_KEY: exact-pack-2026-09-02-v1-7f586ecd90497a4d-linux
  MCEF_JAVA_CEF_COMMIT: a78e832f9f13c2c688caea3d04d8b84fcd238d94
  MCEF_PLATFORM: linux_amd64
  MCEF_CACHE_KEY: mcef-jcef-a78e832f9f13c2c688caea3d04d8b84fcd238d94-linux-amd64-v1
  DISPLAY: ':99'
  LIBGL_ALWAYS_SOFTWARE: 'true'
  GALLIUM_DRIVER: llvmpipe
  MESA_GL_VERSION_OVERRIDE: '4.6'
  MESA_GLSL_VERSION_OVERRIDE: 460
  BOOTOPTIM_MCEF_MIRROR_PORT: '18765'
  BOOTOPTIM_PACK_JAVA_VERSION: '25'
  BOOTOPTIM_PACK_BASE_JVM_ARGS: |-
    -Xmx6G
    -XX:+UnlockExperimentalVMOptions
    -XX:+UseG1GC
    -XX:G1NewSizePercent=20
    -XX:G1ReservePercent=20
    -XX:MaxGCPauseMillis=50
    -XX:G1HeapRegionSize=32M
    -XX:ActiveProcessorCount=4
    -Dmcef.java.cef.commit=a78e832f9f13c2c688caea3d04d8b84fcd238d94
  BOOTOPTIM_PACK_EXTRA_JVM_ARGS: |-
    -Dboot_optim.mixinLifecycleTrace=true
    -Xlog:class+init=info:stderr:uptimenanos,level,tags

jobs:
  profile:
    if: github.head_ref == 'agent102/datafixers-create-subphases-20260910'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install display and CEF dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 \
            libgtk-3-0 libnss3 libnspr4 libxss1 libasound2 \
            libatk1.0-0 libatk-bridge2.0-0 libdrm2 libgbm1 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libxfixes3 libx11-xcb1 libxshmfence1 libcups2 \
            libatspi2.0-0 libpango-1.0-0 libpangocairo-1.0-0 fonts-liberation

      - name: Start Xvfb and verify llvmpipe
        shell: bash
        run: |
          set -euo pipefail
          Xvfb "$DISPLAY" -screen 0 1280x720x24 -nolisten tcp > xvfb.log 2>&1 &
          sleep 2
          glxinfo -B | tee glxinfo.txt
          grep -qi llvmpipe glxinfo.txt
          { echo '=== nproc ==='; nproc; echo '=== memory ==='; free -h; echo '=== kernel ==='; uname -a; } | tee hosted-runner.txt

      - name: Setup compile JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Remember JDK 21
        shell: bash
        run: echo "BOOTOPTIM_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Setup runtime Oracle JDK 25.0.4
        uses: actions/setup-java@v5
        with:
          java-version: '25.0.4'
          distribution: oracle

      - name: Remember JDK 25
        shell: bash
        run: echo "BOOTOPTIM_JDK25=$JAVA_HOME" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Pin Gradle toolchains
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.paths=$BOOTOPTIM_JDK21,$BOOTOPTIM_JDK25" >> "$HOME/.gradle/gradle.properties"

      - name: Restore exact pack
        id: pack-cache
        uses: actions/cache@v4
        with:
          path: .exact-pack-cache/bootoptim-exact-pack.zip
          key: ${{ env.EXACT_PACK_CACHE_KEY }}

      - name: Download exact pack on cache miss
        if: steps.pack-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .exact-pack-cache
          gh release download "$EXACT_PACK_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$EXACT_PACK_ASSET" --dir .exact-pack-cache --clobber

      - name: Verify exact-pack digest
        shell: bash
        run: |
          set -euo pipefail
          actual=$(sha256sum .exact-pack-cache/bootoptim-exact-pack.zip | awk '{print $1}')
          test "$actual" = "$EXACT_PACK_SHA256"

      - name: Restore Linux JCEF
        id: mcef-cache
        uses: actions/cache@v4
        with:
          path: .mcef-jcef
          key: ${{ env.MCEF_CACHE_KEY }}

      - name: Download Linux JCEF on cache miss
        if: steps.mcef-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .mcef-jcef && mkdir -p .mcef-jcef
          base="https://mcef-download.cinemamod.com/java-cef-builds/$MCEF_JAVA_CEF_COMMIT"
          curl --fail --location --retry 5 --retry-all-errors "$base/${MCEF_PLATFORM}.tar.gz.sha256" -o ".mcef-jcef/${MCEF_PLATFORM}.tar.gz.sha256"
          curl --fail --location --retry 5 --retry-all-errors "$base/${MCEF_PLATFORM}.tar.gz" -o ".mcef-jcef/${MCEF_PLATFORM}.tar.gz"
          expected=$(awk 'NR==1 {print $1}' ".mcef-jcef/${MCEF_PLATFORM}.tar.gz.sha256")
          actual=$(sha256sum ".mcef-jcef/${MCEF_PLATFORM}.tar.gz" | awk '{print $1}')
          test "$actual" = "$expected"
          tar -xzf ".mcef-jcef/${MCEF_PLATFORM}.tar.gz" -C .mcef-jcef
          rm ".mcef-jcef/${MCEF_PLATFORM}.tar.gz"

      - name: Stage deterministic JCEF and fixture
        shell: bash
        run: |
          set -euo pipefail
          test -f ".mcef-jcef/$MCEF_PLATFORM/jcef_helper"
          rm -rf build/mcef-libraries .mcef-mirror
          mkdir -p build/mcef-libraries
          cp -a .mcef-jcef/. build/mcef-libraries/
          chmod +x "build/mcef-libraries/$MCEF_PLATFORM/jcef_helper"
          mirror_root="$PWD/.mcef-mirror"
          mirror_dir="$mirror_root/java-cef-builds/$MCEF_JAVA_CEF_COMMIT"
          mkdir -p "$mirror_dir"
          cp ".mcef-jcef/${MCEF_PLATFORM}.tar.gz.sha256" "$mirror_dir/${MCEF_PLATFORM}.tar.gz.sha256"
          echo "BOOTOPTIM_MCEF_MIRROR_ROOT=$mirror_root" >> "$GITHUB_ENV"
          python scripts/exact-pack/prepare_fixture.py \
            --zip .exact-pack-cache/bootoptim-exact-pack.zip \
            --sha256 "$EXACT_PACK_SHA256" \
            --extract .exact-pack-run \
            --mcef-mirror-url "http://127.0.0.1:$BOOTOPTIM_MCEF_MIRROR_PORT"
          echo "BOOTOPTIM_PACK_DIR=$PWD/.exact-pack-run" >> "$GITHUB_ENV"

      - name: Build and prove exact diagnostic replacements
        shell: bash
        run: |
          set -euo pipefail
          python tools/modlauncher-fork-probe/prepare_runtime.py --root "$PWD" --output "$PWD/.agent102-ml-fork-repo" --report "$PWD/modlauncher-fork-build.json"
          python tools/mixin-lifecycle-probe/prepare_runtime.py --root "$PWD" --output "$PWD/.agent102-mixin-fork-repo" --report "$PWD/mixin-fork-build.json"
          export BOOTOPTIM_ML_FORK_REPO="$PWD/.agent102-ml-fork-repo"
          export BOOTOPTIM_MIXIN_FORK_REPO="$PWD/.agent102-mixin-fork-repo"
          ./gradlew preparePackBenchmarkClientRun --no-daemon --console=plain
          ./gradlew -I tools/modlauncher-fork-probe/resolve_launch_files.gradle \
            agent94WriteLaunchResolution \
            -Pagent94LaunchResolutionOutput="$PWD/modlauncher-fork-resolution.json" \
            --no-configuration-cache --no-daemon --console=plain
          python tools/mixin-lifecycle-probe/verify_resolution.py \
            --resolution modlauncher-fork-resolution.json \
            --modlauncher-build modlauncher-fork-build.json \
            --mixin-build mixin-fork-build.json \
            --output agent102-lifecycle-preflight.json
          echo "BOOTOPTIM_ML_FORK_REPO=$BOOTOPTIM_ML_FORK_REPO" >> "$GITHUB_ENV"
          echo "BOOTOPTIM_MIXIN_FORK_REPO=$BOOTOPTIM_MIXIN_FORK_REPO" >> "$GITHUB_ENV"
          echo "JAVA_TOOL_OPTIONS=-Dboot_optim.modlauncherForkTrace=true" >> "$GITHUB_ENV"

      - name: Launch exact pack to main menu and validate resources
        shell: bash
        run: |
          python scripts/exact-pack/run_startup.py --variant agent102-datafixers-create-subphases --iteration 1 --timeout 1200

      - name: Require exact two-request Agent 102 profile
        shell: bash
        run: |
          set -euo pipefail
          python tools/modlauncher-fork-probe/parse_profile.py --console exact-pack-console.log --output modlauncher-fork-profile-v2.json
          python tools/mixin-lifecycle-probe/parse_datafixers.py --console exact-pack-console.log --output agent102-datafixers-profile.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('result.json').read_text())
          result['agent102_lifecycle_preflight'] = json.loads(Path('agent102-lifecycle-preflight.json').read_text())
          result['modlauncher_fork_profile_v2'] = json.loads(Path('modlauncher-fork-profile-v2.json').read_text())
          result['agent102_datafixers_profile'] = json.loads(Path('agent102-datafixers-profile.json').read_text())
          Path('result.json').write_text(json.dumps(result, indent=2) + '\n')
          PY

      - name: Upload Agent 102 lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent102-datafixers-create-subphases-${{ github.event.pull_request.head.sha }}
          path: |
            result.json
            resource-selection-check.json
            resource-selection-reference.txt
            exact-pack-console.log
            exact-pack-thread-dump.log
            agent102-lifecycle-preflight.json
            modlauncher-fork-build.json
            mixin-fork-build.json
            modlauncher-fork-resolution.json
            modlauncher-fork-profile-v2.json
            agent102-datafixers-profile.json
            glxinfo.txt
            hosted-runner.txt
            run-pack-benchmark/logs/latest.log
            run-pack-benchmark/logs/bootoptim-startup.log
            run-pack-benchmark/options.txt
          if-no-files-found: ignore
          retention-days: 14

name: Startup Benchmark

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/integration-current
    paths:
      - 'src/**'
      - 'bootstrap/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/startup-benchmark.yml'

jobs:
  client-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Seed benchmark client options
        run: |
          mkdir -p run-benchmark
          cat > run-benchmark/options.txt <<'EOF'
          onboardAccessibility:false
          narrator:0
          EOF

      - name: Launch client to main menu
        shell: bash
        run: |
          set -uo pipefail
          : > startup-benchmark.log
          xvfb-run -a ./gradlew runBenchmarkClient --no-daemon --console=plain > >(tee startup-benchmark.log) 2>&1 &
          launcher_pid=$!

          marker=''
          for _ in $(seq 1 180); do
            marker="$(grep 'BOOTOPTIM_STARTUP phase=main_menu' startup-benchmark.log | tail -n 1 || true)"
            if [ -n "$marker" ]; then
              break
            fi
            if ! kill -0 "$launcher_pid" 2>/dev/null; then
              wait "$launcher_pid"
              exit_code=$?
              echo "Client process exited before the main-menu marker (exit $exit_code)."
              exit "$exit_code"
            fi
            sleep 1
          done

          if [ -z "$marker" ]; then
            echo 'Main-menu marker was not reached within 180 seconds.'
            : > startup-thread-dump.log
            for pid in $(jps -q); do
              echo "===== JVM $pid =====" >> startup-thread-dump.log
              jcmd "$pid" Thread.print >> startup-thread-dump.log 2>&1 || true
            done
            kill "$launcher_pid" 2>/dev/null || true
            pkill -P "$launcher_pid" 2>/dev/null || true
            exit 1
          fi

          if grep -Eq 'Mixin (apply|prepare) for mod boot_optim failed|InvalidInjectionException.*boot_optim|boot_optim.*InvalidInjectionException' startup-benchmark.log; then
            echo 'BootOptim mixin application failed during startup.'
            grep -E 'Mixin (apply|prepare) for mod boot_optim failed|InvalidInjectionException.*boot_optim|boot_optim.*InvalidInjectionException' startup-benchmark.log || true
            kill "$launcher_pid" 2>/dev/null || true
            pkill -P "$launcher_pid" 2>/dev/null || true
            wait "$launcher_pid" 2>/dev/null || true
            exit 1
          fi

          early_marker="$(grep 'BOOTOPTIM_STARTUP phase=transformation_service_construct' startup-benchmark.log | tail -n 1 || true)"
          test -n "$early_marker"

          config='run-benchmark/config/boot_optim.properties'
          report='run-benchmark/logs/bootoptim-startup.log'
          test -f "$config"
          test -f "$report"
          grep -q '^startupLog=false$' "$config"
          grep -q 'OPTIMIZATION id=mod_scan_cache status=enabled' "$report"
          grep -Eq 'SUMMARY version=0\.1\.5 total_startup_ms=[0-9]+ status=main_menu_reached' "$report"

          # The scaling-campaign branch must prove every broad diagnostic layer works before it is
          # sent to a scarce slow-PC run.
          grep -q 'BOOTOPTIM_CAMPAIGN_JFR event=start' startup-benchmark.log
          grep -q 'BOOTOPTIM_CAMPAIGN_JFR event=stop' startup-benchmark.log
          grep -q 'BOOTOPTIM_SYSTEM_SAMPLE uptime_ms=' startup-benchmark.log
          grep -q 'BOOTOPTIM_RELOAD_CRITICAL event=summary' startup-benchmark.log
          grep -q 'BOOTOPTIM_MODEL_RELOAD phase=bake_models' startup-benchmark.log
          grep -q 'BOOTOPTIM_CAMPAIGN_MODEL_RESIDUAL' startup-benchmark.log

          # Resource/model decomposition v2: make sure the exact 1.21.1 hooks are producing data,
          # not merely applying with require=0 and silently missing their targets.
          grep -q 'BOOTOPTIM_RESOURCE_PIPELINE event=summary' startup-benchmark.log
          grep -q 'BOOTOPTIM_RESOURCE_CONFIG mod=modernfix' startup-benchmark.log
          grep -q 'kind=phase group=wall_scope_sum detail=block_models.enumeration' startup-benchmark.log
          grep -q 'kind=phase group=wall_scope_sum detail=block_states.enumeration' startup-benchmark.log
          grep -q 'detail=atlas.stitch\[' startup-benchmark.log
          grep -q 'detail=atlas.sprite_load_inclusive' startup-benchmark.log

          jfr_file="$(find run-benchmark/.bootoptim/profiles -maxdepth 1 -type f -name 'startup-scaling-*.jfr' | sort | tail -n 1)"
          test -n "$jfr_file"
          test -s "$jfr_file"
          jfr summary "$jfr_file" | tee startup-jfr-summary.log

          echo "$early_marker"
          echo "$marker"
          cat "$report"
          kill "$launcher_pid" 2>/dev/null || true
          pkill -P "$launcher_pid" 2>/dev/null || true
          wait "$launcher_pid" 2>/dev/null || true
          {
            echo '### BootOptim startup benchmark'
            echo
            echo "\`$early_marker\`"
            echo "\`$marker\`"
            echo
            echo 'Startup diagnostics, resource-pipeline decomposition, and scaling-campaign JFR validated.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-benchmark-log
          path: |
            startup-benchmark.log
            startup-thread-dump.log
            startup-jfr-summary.log
            run-benchmark/config/boot_optim.properties
            run-benchmark/logs/bootoptim-startup.log
            run-benchmark/.bootoptim/profiles/*.jfr
          if-no-files-found: ignore

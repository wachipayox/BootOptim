name: Startup Benchmark

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/integration-current
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/startup-benchmark.yml'

jobs:
  client-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Launch client to main menu
        shell: bash
        run: |
          set -o pipefail
          timeout 12m xvfb-run -a ./gradlew runBenchmarkClient --no-daemon --console=plain 2>&1 | tee startup-benchmark.log
          marker="$(grep 'BOOTOPTIM_STARTUP phase=main_menu' startup-benchmark.log | tail -n 1)"
          test -n "$marker"
          echo "$marker"
          {
            echo '### BootOptim startup benchmark'
            echo
            echo "\`$marker\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-benchmark-log
          path: startup-benchmark.log
          if-no-files-found: ignore

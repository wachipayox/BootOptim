name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        # Resource-contract tests use only the standard library on Ubuntu.
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Test benchmark resource contract
        run: python3 -m unittest discover -s tools/laptop-bench -p 'test_*.py' -v

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Validate packaged bootstrap
        shell: bash
        run: |
          set -euo pipefail
          packaged=""
          for candidate in bootstrap/build/libs/*.jar; do
            if jar tf "$candidate" | grep -qx 'META-INF/jarjar/metadata.json'; then
              packaged="$candidate"
              break
            fi
          done
          test -n "$packaged"
          echo "Validating $packaged"
          jar tf "$packaged" | grep -qx 'META-INF/services/cpw.mods.modlauncher.api.ITransformationService'
          test "$(jar tf "$packaged" | grep -cx 'dev/wachipayox/bootoptim/trace/StructuredBootTrace.class')" -eq 1
          unzip -p "$packaged" META-INF/MANIFEST.MF | tr -d '\r' | grep -q '^FMLModType: LIBRARY$'
          jar tf "$packaged" | grep -q '^META-INF/jarjar/.*\.jar$'
          unzip -p "$packaged" META-INF/jarjar/metadata.json | tee bootstrap-jarjar-metadata.json
          grep -q 'boot_optim' bootstrap-jarjar-metadata.json

          inner_path="$(jar tf "$packaged" | grep '^META-INF/jarjar/.*boot_optim.*\.jar$' | head -n 1)"
          test -n "$inner_path"
          unzip -p "$packaged" "$inner_path" > regular-mod.jar
          if jar tf regular-mod.jar | grep -q '^dev/wachipayox/bootoptim/trace/'; then
            echo 'regular nested mod unexpectedly contains trace-core classes' >&2
            exit 1
          fi
          jar tf regular-mod.jar | grep -qx 'dev/wachipayox/bootoptim/profiling/RegularBootTraceBridge.class'

          cp "$packaged" bootoptim-ci.jar

      - name: Upload packaged BootOptim
        uses: actions/upload-artifact@v4
        with:
          name: bootoptim-${{ github.sha }}
          path: bootoptim-ci.jar
          if-no-files-found: error
          retention-days: 14

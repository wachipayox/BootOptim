name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        # Resource-contract tests use only the standard library on Ubuntu.
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Test benchmark resource contract
        run: python3 -m unittest discover -s tools/laptop-bench -p 'test_*.py' -v

      - name: Test strict path grammar
        run: |
          javac -d /tmp/bootoptim-strict-segment src/main/java/dev/wachipayox/bootoptim/optimization/StrictPathSegmentValidator.java tools/research/StrictPathSegmentContract.java
          java -cp /tmp/bootoptim-strict-segment StrictPathSegmentContract

      - name: Validate ancestry accounting
        run: python3 -m unittest discover -s scripts/exact-pack -p 'test_model_ancestry_profile.py' -v

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Validate packaged bootstrap
        shell: bash
        run: |
          set -euo pipefail
          packaged=""
          for candidate in bootstrap/build/libs/*.jar; do
            if jar tf "$candidate" | grep -qx 'META-INF/jarjar/metadata.json'; then
              packaged="$candidate"
              break
            fi
          done
          test -n "$packaged"
          echo "Validating $packaged"
          jar tf "$packaged" | grep -qx 'META-INF/services/cpw.mods.modlauncher.api.ITransformationService'
          unzip -p "$packaged" META-INF/MANIFEST.MF | tr -d '\r' | grep -q '^FMLModType: LIBRARY$'
          jar tf "$packaged" | grep -q '^META-INF/jarjar/.*\.jar$'
          unzip -p "$packaged" META-INF/jarjar/metadata.json | tee bootstrap-jarjar-metadata.json
          grep -q 'boot_optim' bootstrap-jarjar-metadata.json
          cp "$packaged" bootoptim-ci.jar

      - name: Upload packaged BootOptim
        uses: actions/upload-artifact@v4
        with:
          name: bootoptim-${{ github.sha }}
          path: bootoptim-ci.jar
          if-no-files-found: error
          retention-days: 14

name: Decocraft Resource Audit

on:
  push:
    branches:
      - agent/profile-atlas-decode-decomposition
    paths:
      - '.github/workflows/decocraft-resource-audit.yml'
      - 'tools/audit_decocraft_jar.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download exact Decocraft 3.0.11 NeoForge JAR
        run: |
          curl --fail --location --retry 3 \
            'https://cdn.modrinth.com/data/IZJSgKZe/versions/Z8xm2POI/decocraft-3.0.11-1.21.1-neoforge.jar' \
            --output decocraft-3.0.11-1.21.1-neoforge.jar
          sha256sum decocraft-3.0.11-1.21.1-neoforge.jar
          ls -lh decocraft-3.0.11-1.21.1-neoforge.jar

      - name: Audit PNG layout, compression, dimensions and duplicates
        run: |
          python3 tools/audit_decocraft_jar.py \
            decocraft-3.0.11-1.21.1-neoforge.jar \
            decocraft-resource-audit.txt

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: decocraft-resource-audit
          path: decocraft-resource-audit.txt
          retention-days: 14

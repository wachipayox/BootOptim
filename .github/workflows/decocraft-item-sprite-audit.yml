name: Decocraft item-sprite audit

on:
  push:
    branches:
      - agent/research-decocraft-item-sprite-elision
      - agent/experiment-decocraft-3d-items
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit exact Decocraft release
        run: python tools/audit_decocraft_item_sprites.py

      - name: Validate exact candidate and keep counts
        shell: bash
        run: |
          set -euo pipefail
          candidates=$(grep -vc '^#' decocraft-3d-item-candidates.txt)
          keep=$(grep -vc '^#' decocraft-3d-item-keep-textures.txt)
          echo "candidate_count=$candidates keep_count=$keep"
          test "$candidates" -eq 3192
          test "$keep" -eq 63

      - name: Upload report and mappings
        uses: actions/upload-artifact@v4
        with:
          name: decocraft-item-sprite-audit-${{ github.sha }}
          path: |
            decocraft-item-sprite-audit.md
            decocraft-3d-item-candidates.txt
            decocraft-3d-item-keep-textures.txt
          if-no-files-found: error
          retention-days: 14

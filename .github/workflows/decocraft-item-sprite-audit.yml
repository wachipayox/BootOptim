name: Decocraft item-sprite audit

on:
  push:
    branches:
      - agent/research-decocraft-item-sprite-elision
      - agent/experiment-decocraft-3d-items
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit exact Decocraft release
        run: python tools/audit_decocraft_item_sprites.py

      - name: Validate exact candidate and keep invariants
        shell: bash
        run: |
          set -euo pipefail
          candidates=$(grep -vc '^#' decocraft-3d-item-candidates.txt)
          keep=$(grep -vc '^#' decocraft-3d-item-keep-textures.txt)
          echo "candidate_count=$candidates keep_count=$keep"
          test "$candidates" -eq 3192
          test "$keep" -eq 63
          cmp decocraft-3d-item-keep-textures.txt src/main/resources/bootoptim/decocraft-3.0.11-item-textures-keep.txt
          python - <<'PY'
          from pathlib import Path
          rows = []
          for line in Path('decocraft-3d-item-candidates.txt').read_text(encoding='utf-8').splitlines():
              if not line or line.startswith('#'):
                  continue
              item_model, texture = line.split('\t')
              texture_path = texture.split(':', 1)[1]
              assert texture_path.startswith('item/')
              rows.append((item_model, texture_path[len('item/'):]))
          mismatches = [(item, texture) for item, texture in rows if item != texture]
          print(f'same_name_candidates={len(rows) - len(mismatches)} mismatches={len(mismatches)}')
          assert len(rows) == 3192
          assert not mismatches
          PY

      - name: Upload report and mappings
        uses: actions/upload-artifact@v4
        with:
          name: decocraft-item-sprite-audit-${{ github.sha }}
          path: |
            decocraft-item-sprite-audit.md
            decocraft-3d-item-candidates.txt
            decocraft-3d-item-keep-textures.txt
          if-no-files-found: error
          retention-days: 14

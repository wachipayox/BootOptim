name: Agent110 FML 4.0.43 JiJ Validation

on:
  push:
    branches:
      - agent110/jij-copy-sha-profile-20260910
    paths:
      - '.github/workflows/agent110-jij-profile.yml'
      - 'jij-profile-agent/**'
      - 'tools/jij-profile/**'

permissions:
  contents: read

env:
  EXACT_PACK_TAG: exact-pack-2026-09-02-v1
  EXACT_PACK_ASSET: bootoptim-exact-pack.zip
  EXACT_PACK_SHA256: 7f586ecd90497a4d4aa1d2024af2643dbd64691864edbad9eb2ed40551c55639
  MCEF_JAVA_CEF_COMMIT: a78e832f9f13c2c688caea3d04d8b84fcd238d94
  MCEF_PLATFORM: linux_amd64
  DISPLAY: ':99'
  LIBGL_ALWAYS_SOFTWARE: 'true'
  GALLIUM_DRIVER: llvmpipe
  MESA_GL_VERSION_OVERRIDE: '4.6'
  MESA_GLSL_VERSION_OVERRIDE: '460'
  BOOTOPTIM_MCEF_MIRROR_PORT: '18765'
  BOOTOPTIM_PACK_JAVA_VERSION: '25'
  BOOTOPTIM_PACK_BASE_JVM_ARGS: |-
    -Xmx6G
    -XX:+UnlockExperimentalVMOptions
    -XX:+UseG1GC
    -XX:G1NewSizePercent=20
    -XX:G1ReservePercent=20
    -XX:MaxGCPauseMillis=50
    -XX:G1HeapRegionSize=32M
    -XX:ActiveProcessorCount=4
    -Dmcef.java.cef.commit=a78e832f9f13c2c688caea3d04d8b84fcd238d94

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install display and CEF dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 \
            libgtk-3-0 libnss3 libnspr4 libxss1 libasound2 \
            libatk1.0-0 libatk-bridge2.0-0 libdrm2 libgbm1 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libxfixes3 libx11-xcb1 libxshmfence1 libcups2 \
            libatspi2.0-0 libpango-1.0-0 libpangocairo-1.0-0 fonts-liberation
          Xvfb "$DISPLAY" -screen 0 1280x720x24 -nolisten tcp > xvfb.log 2>&1 &
          for _ in $(seq 1 20); do
            if glxinfo -B > glxinfo.txt 2>&1; then break; fi
            sleep 0.25
          done
          grep -qi llvmpipe glxinfo.txt

      - name: Setup compile JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Remember JDK 21
        shell: bash
        run: echo "BOOTOPTIM_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Setup runtime JDK 25.0.4
        uses: actions/setup-java@v5
        with:
          java-version: '25.0.4'
          distribution: oracle

      - name: Remember JDK 25
        shell: bash
        run: echo "BOOTOPTIM_JDK25=$JAVA_HOME" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build diagnostic agent
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.paths=$BOOTOPTIM_JDK21,$BOOTOPTIM_JDK25" >> "$HOME/.gradle/gradle.properties"
          ./gradlew -p jij-profile-agent jar
          python -m py_compile tools/jij-profile/analyze_jij_profile.py
          agent="$GITHUB_WORKSPACE/jij-profile-agent/build/libs/bootoptim-jij-profile-agent.jar"
          test -f "$agent"
          {
            echo 'BOOTOPTIM_PACK_EXTRA_JVM_ARGS<<EOF'
            echo "-javaagent:$agent"
            echo '-Dboot_optim.jijProfile=true'
            echo '-Dboot_optim.jijProfile.expectedFmlVersion=4.0.43'
            echo "-Dboot_optim.jijProfile.output=$GITHUB_WORKSPACE/run-pack-benchmark/bootoptim-jij-profile.jsonl"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Download exact pack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .exact-pack-cache
          gh release download "$EXACT_PACK_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$EXACT_PACK_ASSET" --dir .exact-pack-cache --clobber
          test "$(sha256sum .exact-pack-cache/bootoptim-exact-pack.zip | awk '{print $1}')" = "$EXACT_PACK_SHA256"

      - name: Download pinned JCEF
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .mcef-jcef && mkdir -p .mcef-jcef
          base="https://mcef-download.cinemamod.com/java-cef-builds/$MCEF_JAVA_CEF_COMMIT"
          curl --fail --location --retry 5 --retry-all-errors "$base/${MCEF_PLATFORM}.tar.gz.sha256" -o ".mcef-jcef/${MCEF_PLATFORM}.tar.gz.sha256"
          curl --fail --location --retry 5 --retry-all-errors "$base/${MCEF_PLATFORM}.tar.gz" -o ".mcef-jcef/${MCEF_PLATFORM}.tar.gz"
          expected=$(awk 'NR==1 {print $1}' ".mcef-jcef/${MCEF_PLATFORM}.tar.gz.sha256")
          actual=$(sha256sum ".mcef-jcef/${MCEF_PLATFORM}.tar.gz" | awk '{print $1}')
          test "$actual" = "$expected"
          tar -xzf ".mcef-jcef/${MCEF_PLATFORM}.tar.gz" -C .mcef-jcef
          rm ".mcef-jcef/${MCEF_PLATFORM}.tar.gz"

      - name: Prepare fixture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/mcef-libraries .mcef-mirror .exact-pack-run run-pack-benchmark
          mkdir -p build/mcef-libraries
          cp -a .mcef-jcef/. build/mcef-libraries/
          chmod +x "build/mcef-libraries/$MCEF_PLATFORM/jcef_helper"
          mirror_root="$PWD/.mcef-mirror"
          mirror_dir="$mirror_root/java-cef-builds/$MCEF_JAVA_CEF_COMMIT"
          mkdir -p "$mirror_dir"
          cp ".mcef-jcef/${MCEF_PLATFORM}.tar.gz.sha256" "$mirror_dir/${MCEF_PLATFORM}.tar.gz.sha256"
          echo "BOOTOPTIM_MCEF_MIRROR_ROOT=$mirror_root" >> "$GITHUB_ENV"
          python scripts/exact-pack/prepare_fixture.py --zip .exact-pack-cache/bootoptim-exact-pack.zip --sha256 "$EXACT_PACK_SHA256" --extract .exact-pack-run --mcef-mirror-url "http://127.0.0.1:$BOOTOPTIM_MCEF_MIRROR_PORT"

      - name: Exact-pack JiJ profile
        shell: bash
        run: |
          set -euo pipefail
          python scripts/exact-pack/run_startup.py --variant jij-fml-4.0.43 --iteration 1 --timeout 1200 --rerun-tasks
          test -s run-pack-benchmark/bootoptim-jij-profile.jsonl
          python tools/jij-profile/analyze_jij_profile.py \
            --trace run-pack-benchmark/bootoptim-jij-profile.jsonl \
            --startup exact-pack-console.log \
            --json-output jij-profile-summary.json \
            --markdown-output jij-profile-summary.md
          cat jij-profile-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent110-jij-profile-validation
          path: |
            jij-profile-summary.json
            jij-profile-summary.md
            exact-pack-console.log
            result.json
            resource-selection-check.json
            run-pack-benchmark/bootoptim-jij-profile.jsonl
            run-pack-benchmark/logs/latest.log
            run-pack-benchmark/logs/bootoptim-startup.log
            xvfb.log
            glxinfo.txt
          if-no-files-found: ignore
          retention-days: 14

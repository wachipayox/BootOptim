name: Exact Pack Startup Benchmark

on:
  pull_request:
    branches:
      - agent/integration-current
    types:
      - opened
      - synchronize
      - reopened
      - edited
  workflow_dispatch:
    inputs:
      mode:
        description: Benchmark mode
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - ab
      repetitions:
        description: A/B repetitions per variant (1-5)
        required: true
        default: '3'
        type: string
      smoke_jvm_args:
        description: Optional newline-separated JVM args for smoke mode
        required: false
        default: ''
        type: string
      candidate_jvm_args:
        description: Optional newline-separated candidate JVM args for A/B
        required: false
        default: ''
        type: string
      control_jvm_args:
        description: Optional newline-separated control JVM args for A/B
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: exact-pack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PACK_TAG: exact-pack-2026-09-02-v1
  EXACT_PACK_ASSET: bootoptim-exact-pack.zip
  EXACT_PACK_SHA256: 7f586ecd90497a4d4aa1d2024af2643dbd64691864edbad9eb2ed40551c55639
  EXACT_PACK_CACHE_KEY: exact-pack-2026-09-02-v1-7f586ecd90497a4d-linux
  MCEF_JAVA_CEF_COMMIT: a78e832f9f13c2c688caea3d04d8b84fcd238d94
  MCEF_PLATFORM: linux_amd64
  MCEF_CACHE_KEY: mcef-jcef-a78e832f9f13c2c688caea3d04d8b84fcd238d94-linux-amd64-v1

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.body || '', '[exact-pack-ci]')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      mode: ${{ steps.plan.outputs.mode }}
    env:
      PR_BODY: ${{ github.event.pull_request.body || '' }}
      DISPATCH_MODE: ${{ inputs.mode || '' }}
      DISPATCH_REPETITIONS: ${{ inputs.repetitions || '' }}
      DISPATCH_SMOKE_ARGS: ${{ inputs.smoke_jvm_args || '' }}
      DISPATCH_CANDIDATE_ARGS: ${{ inputs.candidate_jvm_args || '' }}
      DISPATCH_CONTROL_ARGS: ${{ inputs.control_jvm_args || '' }}
    steps:
      - name: Build benchmark matrix
        id: plan
        shell: python
        run: |
          import json
          import os
          import re

          body = os.environ.get('PR_BODY', '')
          event_is_dispatch = bool(os.environ.get('DISPATCH_MODE', '').strip())

          def directive(name):
              pattern = rf'^\s*{re.escape(name)}\s*:\s*(.*?)\s*$'
              return [m.group(1) for m in re.finditer(pattern, body, re.IGNORECASE | re.MULTILINE)]

          if event_is_dispatch:
              mode = os.environ.get('DISPATCH_MODE', 'smoke').strip().lower()
              repetitions_text = os.environ.get('DISPATCH_REPETITIONS', '3').strip() or '3'
              smoke_args = os.environ.get('DISPATCH_SMOKE_ARGS', '').strip()
              candidate_args = os.environ.get('DISPATCH_CANDIDATE_ARGS', '').strip()
              control_args = os.environ.get('DISPATCH_CONTROL_ARGS', '').strip()
          else:
              mode_values = directive('exact-pack-mode')
              mode = (mode_values[-1] if mode_values else 'smoke').strip().lower()
              repetition_values = directive('exact-pack-repetitions')
              repetitions_text = (repetition_values[-1] if repetition_values else '3').strip()
              smoke_args = '\n'.join(directive('exact-pack-smoke-jvm-arg')).strip()
              candidate_args = '\n'.join(directive('exact-pack-candidate-jvm-arg')).strip()
              control_args = '\n'.join(directive('exact-pack-control-jvm-arg')).strip()

          if mode not in {'smoke', 'ab'}:
              raise SystemExit(f'Unsupported exact-pack mode: {mode}')
          try:
              repetitions = int(repetitions_text)
          except ValueError as exc:
              raise SystemExit(f'Invalid exact-pack-repetitions: {repetitions_text}') from exc
          if not 1 <= repetitions <= 5:
              raise SystemExit('exact-pack-repetitions must be between 1 and 5')

          include = []
          if mode == 'smoke':
              include.append({'variant': 'smoke', 'iteration': 1, 'jvm_args': smoke_args})
          else:
              if candidate_args == control_args:
                  raise SystemExit('A/B mode requires candidate and control JVM args to differ.')
              for iteration in range(1, repetitions + 1):
                  include.append({'variant': 'control', 'iteration': iteration, 'jvm_args': control_args})
                  include.append({'variant': 'candidate', 'iteration': iteration, 'jvm_args': candidate_args})

          matrix = json.dumps({'include': include}, separators=(',', ':'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'matrix={matrix}\n')
              output.write(f'mode={mode}\n')
          print(json.dumps({'mode': mode, 'runs': include}, indent=2))

  fixture:
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Restore exact-pack ZIP cache
        id: pack-cache
        uses: actions/cache@v4
        with:
          path: .exact-pack-cache/bootoptim-exact-pack.zip
          key: ${{ env.EXACT_PACK_CACHE_KEY }}

      - name: Download pinned exact-pack release asset
        if: steps.pack-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .exact-pack-cache
          gh release download "$EXACT_PACK_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$EXACT_PACK_ASSET" \
            --dir .exact-pack-cache \
            --clobber

      - name: Verify pinned exact-pack SHA-256
        shell: bash
        run: |
          set -euo pipefail
          path=.exact-pack-cache/bootoptim-exact-pack.zip
          test -f "$path"
          actual=$(sha256sum "$path" | awk '{print $1}')
          test "$actual" = "$EXACT_PACK_SHA256" || {
            echo "Exact-pack SHA mismatch. expected=$EXACT_PACK_SHA256 actual=$actual" >&2
            exit 1
          }
          echo "Exact-pack fixture SHA-256 verified: $actual"

      - name: Restore pinned Linux JCEF cache
        id: mcef-cache
        uses: actions/cache@v4
        with:
          path: .mcef-jcef
          key: ${{ env.MCEF_CACHE_KEY }}

      - name: Download and verify pinned Linux JCEF
        if: steps.mcef-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .mcef-jcef
          mkdir -p .mcef-jcef
          base="https://mcef-download.cinemamod.com/java-cef-builds/$MCEF_JAVA_CEF_COMMIT"
          checksum=.mcef-jcef/${MCEF_PLATFORM}.tar.gz.sha256
          archive=.mcef-jcef/${MCEF_PLATFORM}.tar.gz
          curl --fail --location --retry 5 --retry-all-errors \
            "$base/${MCEF_PLATFORM}.tar.gz.sha256" -o "$checksum"
          curl --fail --location --retry 5 --retry-all-errors \
            "$base/${MCEF_PLATFORM}.tar.gz" -o "$archive"
          expected=$(tr -d '\r' < "$checksum" | awk 'NR==1 {print $1}')
          actual=$(sha256sum "$archive" | awk '{print $1}')
          test -n "$expected"
          test "$actual" = "$expected" || {
            echo "Pinned JCEF SHA mismatch. expected=$expected actual=$actual" >&2
            exit 1
          }
          tar -xzf "$archive" -C .mcef-jcef
          rm -f "$archive"
          test -f ".mcef-jcef/$MCEF_PLATFORM/jcef_helper"
          echo "Pinned JCEF verified: commit=$MCEF_JAVA_CEF_COMMIT platform=$MCEF_PLATFORM sha256=$actual"

  benchmark:
    needs:
      - plan
      - fixture
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      DISPLAY: ':99'
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      MESA_GL_VERSION_OVERRIDE: '4.6'
      MESA_GLSL_VERSION_OVERRIDE: '460'
      BOOTOPTIM_MCEF_MIRROR_PORT: '18765'
      BOOTOPTIM_PACK_JAVA_VERSION: '25'
      BOOTOPTIM_PACK_BASE_JVM_ARGS: |-
        -Xmx6G
        -XX:+UnlockExperimentalVMOptions
        -XX:+UseG1GC
        -XX:G1NewSizePercent=20
        -XX:G1ReservePercent=20
        -XX:MaxGCPauseMillis=50
        -XX:G1HeapRegionSize=32M
        -XX:ActiveProcessorCount=4
        -Dmcef.java.cef.commit=a78e832f9f13c2c688caea3d04d8b84fcd238d94
      BOOTOPTIM_PACK_EXTRA_JVM_ARGS: ${{ matrix.jvm_args }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install software display and CEF runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 \
            libgtk-3-0 libnss3 libnspr4 libxss1 libasound2 \
            libatk1.0-0 libatk-bridge2.0-0 libdrm2 libgbm1 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libxfixes3 libx11-xcb1 libxshmfence1 libcups2 \
            libatspi2.0-0 libpango-1.0-0 libpangocairo-1.0-0 \
            fonts-liberation

      - name: Start Xvfb and verify llvmpipe OpenGL
        shell: bash
        run: |
          set -euo pipefail
          Xvfb "$DISPLAY" -screen 0 1280x720x24 -nolisten tcp > xvfb.log 2>&1 &
          echo $! > xvfb.pid
          sleep 2
          glxinfo -B | tee glxinfo.txt
          grep -qi 'llvmpipe' glxinfo.txt || {
            echo 'Expected Mesa llvmpipe software renderer was not active.' >&2
            exit 1
          }

      - name: Record hosted runner resources
        shell: bash
        run: |
          {
            echo '=== nproc ==='
            nproc
            echo '=== memory ==='
            free -h
            echo '=== kernel ==='
            uname -a
          } | tee hosted-runner.txt

      - name: Setup compile JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Remember JDK 21 path
        shell: bash
        run: echo "BOOTOPTIM_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Setup reference runtime Oracle JDK 25.0.4
        uses: actions/setup-java@v5
        with:
          java-version: '25.0.4'
          distribution: oracle

      - name: Remember JDK 25 path
        shell: bash
        run: echo "BOOTOPTIM_JDK25=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Pin Gradle toolchain discovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.paths=$BOOTOPTIM_JDK21,$BOOTOPTIM_JDK25" >> "$HOME/.gradle/gradle.properties"
          echo "Gradle JDK paths: $BOOTOPTIM_JDK21,$BOOTOPTIM_JDK25"

      - name: Restore exact-pack ZIP
        uses: actions/cache/restore@v4
        with:
          path: .exact-pack-cache/bootoptim-exact-pack.zip
          key: ${{ env.EXACT_PACK_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Restore pinned Linux JCEF
        uses: actions/cache/restore@v4
        with:
          path: .mcef-jcef
          key: ${{ env.MCEF_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Stage deterministic MCEF development libraries
        shell: bash
        run: |
          set -euo pipefail
          test -f ".mcef-jcef/$MCEF_PLATFORM/jcef_helper"
          rm -rf build/mcef-libraries .mcef-mirror
          mkdir -p build/mcef-libraries
          cp -a .mcef-jcef/. build/mcef-libraries/
          chmod +x "build/mcef-libraries/$MCEF_PLATFORM/jcef_helper"
          mirror_root="$PWD/.mcef-mirror"
          mirror_dir="$mirror_root/java-cef-builds/$MCEF_JAVA_CEF_COMMIT"
          mkdir -p "$mirror_dir"
          cp ".mcef-jcef/${MCEF_PLATFORM}.tar.gz.sha256" "$mirror_dir/${MCEF_PLATFORM}.tar.gz.sha256"
          echo "BOOTOPTIM_MCEF_MIRROR_ROOT=$mirror_root" >> "$GITHUB_ENV"
          echo "Staged pinned JCEF at $PWD/build/mcef-libraries/$MCEF_PLATFORM"

      - name: Verify and extract exact-pack fixture
        shell: bash
        run: |
          python scripts/exact-pack/prepare_fixture.py \
            --zip .exact-pack-cache/bootoptim-exact-pack.zip \
            --sha256 "$EXACT_PACK_SHA256" \
            --extract .exact-pack-run \
            --mcef-mirror-url "http://127.0.0.1:$BOOTOPTIM_MCEF_MIRROR_PORT"

      - name: Launch exact pack to main menu
        shell: bash
        run: |
          python scripts/exact-pack/run_startup.py \
            --variant '${{ matrix.variant }}' \
            --iteration ${{ matrix.iteration }} \
            --timeout 1200

      - name: Upload exact-pack run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-pack-result-${{ matrix.variant }}-${{ matrix.iteration }}
          path: |
            result.json
            resource-selection-check.json
            resource-selection-reference.txt
            exact-pack-console.log
            exact-pack-thread-dump.log
            xvfb.log
            glxinfo.txt
            hosted-runner.txt
            run-pack-benchmark/logs/latest.log
            run-pack-benchmark/logs/bootoptim-startup.log
            run-pack-benchmark/config/boot_optim.properties
            run-pack-benchmark/config/fml.toml
            run-pack-benchmark/config/mcef/mcef.properties
            run-pack-benchmark/options.txt
          if-no-files-found: ignore
          retention-days: 14

  aggregate:
    if: always() && needs.plan.result == 'success'
    needs:
      - plan
      - benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download exact-pack run results
        uses: actions/download-artifact@v4
        with:
          pattern: exact-pack-result-*
          path: exact-pack-results

      - name: Aggregate exact-pack medians
        shell: bash
        run: |
          python scripts/exact-pack/summarize_startup.py aggregate \
            --results-dir exact-pack-results \
            --output exact-pack-summary.md \
            --json-output exact-pack-summary.json
          cat exact-pack-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact-pack summary
        uses: actions/upload-artifact@v4
        with:
          name: exact-pack-summary
          path: |
            exact-pack-summary.md
            exact-pack-summary.json
          retention-days: 30

      - name: Propagate benchmark failure
        if: needs.benchmark.result != 'success'
        shell: bash
        run: |
          echo 'One or more exact-pack benchmark jobs failed.' >&2
          exit 1

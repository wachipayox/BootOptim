name: Startup JFR Profile

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/integration-current
    paths:
      - 'src/**'
      - 'bootstrap/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/startup-jfr.yml'

jobs:
  startup-jfr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Seed profiling client options
        run: |
          mkdir -p run-jfr-benchmark
          cat > run-jfr-benchmark/options.txt <<'EOF'
          onboardAccessibility:false
          narrator:0
          EOF

      - name: Record startup JFR
        shell: bash
        run: |
          set -o pipefail
          rm -f build/startup-profile.jfr startup-jfr.log
          timeout 180s xvfb-run -a ./gradlew runStartupJfrClient --no-daemon --console=plain 2>&1 | tee startup-jfr.log
          grep 'BOOTOPTIM_STARTUP phase=main_menu' startup-jfr.log
          test -s build/startup-profile.jfr

      - name: Summarize startup JFR
        shell: bash
        run: |
          set -euo pipefail
          jfr summary build/startup-profile.jfr > startup-jfr-summary.txt

          if jfr view hot-methods build/startup-profile.jfr > startup-hot-methods.txt 2>startup-jfr-view-error.txt; then
            jfr view hot-threads build/startup-profile.jfr > startup-hot-threads.txt 2>>startup-jfr-view-error.txt || true
          else
            jfr print --events jdk.ExecutionSample,jdk.NativeMethodSample build/startup-profile.jfr > startup-execution-samples.txt
          fi

          {
            echo '### BootOptim startup JFR'
            echo
            grep 'BOOTOPTIM_STARTUP phase=dependency_discovery_end' startup-jfr.log | tail -n 1 || true
            grep 'BOOTOPTIM_STARTUP phase=mod_entrypoint' startup-jfr.log | tail -n 1 || true
            grep 'BOOTOPTIM_STARTUP phase=main_menu' startup-jfr.log | tail -n 1 || true
            echo
            echo '```text'
            if [ -s startup-hot-methods.txt ]; then
              head -n 45 startup-hot-methods.txt
            else
              head -n 45 startup-jfr-summary.txt
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          cat startup-hot-methods.txt 2>/dev/null || true

      - name: Upload JFR diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-jfr-profile
          path: |
            build/startup-profile.jfr
            startup-jfr.log
            startup-jfr-summary.txt
            startup-hot-methods.txt
            startup-hot-threads.txt
            startup-execution-samples.txt
            startup-jfr-view-error.txt
          if-no-files-found: ignore

name: Real Model Class Replay

on:
  pull_request:
    branches:
      - agent/integration-current
    paths:
      - 'src/modelReplay/**'
      - 'tools/model-class-replay/**'
      - '.github/workflows/model-class-replay.yml'
      - 'docs/research/model-class-replay-2026-09-08.md'
  workflow_dispatch:
    inputs:
      full_pack:
        description: Materialize all discovered winning model resources instead of the bounded representative sample
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: model-class-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PACK_TAG: exact-pack-2026-09-02-v1
  EXACT_PACK_ASSET: bootoptim-exact-pack.zip
  EXACT_PACK_SHA256: 7f586ecd90497a4d4aa1d2024af2643dbd64691864edbad9eb2ed40551c55639
  EXACT_PACK_CACHE_KEY: exact-pack-2026-09-02-v1-7f586ecd90497a4d-model-class-replay

jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit-test fixture selection and precedence helper
        run: python -m unittest discover -s tools/model-class-replay -p 'test_*.py' -v

      - name: Run real pre-parent class smoke
        run: ./gradlew -I tools/model-class-replay/model-replay.init.gradle modelReplaySelfTest --stacktrace

      - name: Reproduce clean-JavaExec NeoForge bootstrap blocker
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew -I tools/model-class-replay/model-replay.init.gradle modelReplayBootstrapBoundary --stacktrace > model-replay-bootstrap-boundary.log 2>&1
          status=$?
          set -e
          cat model-replay-bootstrap-boundary.log

          if [[ $status -eq 0 ]]; then
            echo 'Expected clean-JavaExec bootstrap to fail before FML establishes LoadingModList, but it succeeded.' >&2
            exit 1
          fi

          grep -F 'FeatureFlagLoader.loadModdedFlags' model-replay-bootstrap-boundary.log
          grep -F 'LoadingModList.get()' model-replay-bootstrap-boundary.log
          grep -F 'Bootstrap.bootStrap' model-replay-bootstrap-boundary.log
          echo 'MODEL_CLASS_PARENT_BOUNDARY_REPRODUCED FeatureFlagLoader->LoadingModList'

      - name: Restore exact-pack ZIP cache
        id: pack-cache
        uses: actions/cache/restore@v4
        with:
          path: .exact-pack-cache/bootoptim-exact-pack.zip
          key: ${{ env.EXACT_PACK_CACHE_KEY }}

      - name: Download pinned exact-pack release asset
        if: steps.pack-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .exact-pack-cache
          gh release download "$EXACT_PACK_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$EXACT_PACK_ASSET" \
            --dir .exact-pack-cache \
            --clobber

      - name: Verify and extract exact-pack fixture
        shell: bash
        run: |
          set -euo pipefail
          actual=$(sha256sum .exact-pack-cache/bootoptim-exact-pack.zip | awk '{print $1}')
          test "$actual" = "$EXACT_PACK_SHA256"
          python scripts/exact-pack/prepare_fixture.py \
            --zip .exact-pack-cache/bootoptim-exact-pack.zip \
            --sha256 "$EXACT_PACK_SHA256" \
            --extract exact-pack-run

      - name: Build bounded provenance-preserving model fixture
        shell: bash
        env:
          FULL_PACK: ${{ inputs.full_pack || false }}
        run: |
          set -euo pipefail
          if test -d exact-pack-run/mods; then
            pack_root=exact-pack-run
          else
            pack_root=$(find exact-pack-run -mindepth 2 -maxdepth 2 -type d -name mods -print -quit | sed 's#/mods$##')
          fi
          test -n "$pack_root"
          extra=()
          if [[ "$FULL_PACK" == "true" ]]; then extra+=(--full); fi
          python tools/model-class-replay/prepare_fixture.py \
            --pack-root "$pack_root" \
            --output-dir model-replay-fixture \
            --limit 24 \
            "${extra[@]}"

      - name: Replay real classes inside FML data lifecycle - execution 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model-replay-out/run1
          BOOTOPTIM_MODEL_REPLAY_MANIFEST="$PWD/model-replay-fixture/manifest.json" \
          BOOTOPTIM_MODEL_REPLAY_OUTPUT="$PWD/model-replay-out/run1" \
          ./gradlew -I tools/model-class-replay/model-replay.init.gradle runData --stacktrace
          test -f model-replay-out/run1/replay.json

      - name: Restore generated-data workspace between replay JVMs
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src/generated/resources 2>/dev/null || true
          git clean -fd src/generated/resources 2>/dev/null || true

      - name: Replay real classes inside FML data lifecycle - execution 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model-replay-out/run2
          BOOTOPTIM_MODEL_REPLAY_MANIFEST="$PWD/model-replay-fixture/manifest.json" \
          BOOTOPTIM_MODEL_REPLAY_OUTPUT="$PWD/model-replay-out/run2" \
          ./gradlew -I tools/model-class-replay/model-replay.init.gradle runData --stacktrace
          test -f model-replay-out/run2/replay.json

      - name: Require cross-process reproducible semantic digest
        shell: python
        run: |
          import json
          from pathlib import Path

          one = json.loads(Path('model-replay-out/run1/replay.json').read_text())
          two = json.loads(Path('model-replay-out/run2/replay.json').read_text())
          assert one['semantic_sha256'] == two['semantic_sha256'], (one['semantic_sha256'], two['semantic_sha256'])
          for result in (one, two):
              assert result['stock_repeat_equal'] is True
              assert result['identity_candidate_equal'] is True
              assert result['fault_probe_detected'] is True
              phases = result['stock_1']['phases']
              for phase in ('real_blockmodel_parse', 'real_parent_resolution', 'real_texture_chain_material_lookup', 'real_elementsmodel_construction'):
                  assert phases[phase]['count'] > 0, (phase, phases[phase])
          print('cross-process semantic digest:', one['semantic_sha256'])

      - name: Publish readable summary
        if: always()
        shell: bash
        run: |
          if [[ -f model-replay-out/run1/summary.md ]]; then cat model-replay-out/run1/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'

          This workflow executes the model replay from a real FML/ModLauncher `runData` lifecycle, not a clean JavaExec.
          Its wall/CPU/allocation numbers remain harness measurements, not TTMM, HDD/page-cache, GPU, or laptop evidence.
          The digest does not claim current sprites, FaceBakery/BakedQuad vertex ints, render buckets, ModelState-dependent
          output, callbacks, or GL because those remain beyond this headless boundary.
          EOF

      - name: Upload replay JSON CSV provenance and summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-model-class-replay
          path: |
            model-replay-fixture/manifest.json
            model-replay-out/**
            model-replay-bootstrap-boundary.log
          if-no-files-found: warn
          retention-days: 14

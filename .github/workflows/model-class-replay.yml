name: Model Class Replay Boundary Probe

on:
  pull_request:
    branches:
      - agent/integration-current
    paths:
      - 'src/modelReplay/**'
      - 'tools/model-class-replay/**'
      - '.github/workflows/model-class-replay.yml'
      - 'docs/research/model-class-replay-2026-09-08.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit-test fixture selection and precedence helper
        run: python -m unittest discover -s tools/model-class-replay -p 'test_*.py' -v

      - name: Run real pre-parent class smoke
        run: ./gradlew -I tools/model-class-replay/model-replay.init.gradle modelReplaySelfTest --stacktrace

      - name: Reproduce clean-JavaExec NeoForge bootstrap blocker
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew -I tools/model-class-replay/model-replay.init.gradle modelReplayBootstrapBoundary --stacktrace > model-replay-bootstrap-boundary.log 2>&1
          status=$?
          set -e
          cat model-replay-bootstrap-boundary.log

          if [[ $status -eq 0 ]]; then
            echo 'Expected clean-JavaExec bootstrap to fail before FML establishes LoadingModList, but it succeeded.' >&2
            exit 1
          fi

          grep -F 'FeatureFlagLoader.loadModdedFlags' model-replay-bootstrap-boundary.log
          grep -F 'LoadingModList.get()' model-replay-bootstrap-boundary.log
          grep -F 'Bootstrap.bootStrap' model-replay-bootstrap-boundary.log
          echo 'MODEL_CLASS_PARENT_BOUNDARY_REPRODUCED FeatureFlagLoader->LoadingModList'

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          # Model class headless boundary

          The green smoke executes real `BlockModel.fromStream`, `BlockModel#getMaterial`, real element/face objects,
          and NeoForge `ElementsModel` construction without a graphical client.

          Real `BlockModel.resolveParents` is **not** claimed here. In a clean JavaExec it reaches `ModelBakery`, which
          requires Minecraft registry bootstrap. NeoForge's `Bootstrap.bootStrap()` then reaches
          `FeatureFlagLoader.loadModdedFlags`, where `LoadingModList.get()` is null because FML/ModLauncher has not run.
          The second task passes only when that exact blocker is reproduced. No fake LoadingModList is installed.

          Next frontier: launch the probe inside a real FML/ModLauncher test/data or minimal client-smoke lifecycle,
          then re-enable exact-pack parent/digest phases. These checks are not TTMM or laptop evidence.
          EOF

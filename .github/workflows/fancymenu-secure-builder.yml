name: Temporary Secure FancyMenu Builder

on:
  push:
    branches:
      - temp/fancymenu-emf-secure-build-20260925
    paths:
      - '.github/workflows/fancymenu-secure-builder.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout builder branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Generate and publish ephemeral public key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/fm-private.pem
          openssl pkey -in /tmp/fm-private.pem -pubout -out /tmp/fm-public.pem
          mkdir -p .tmp-fancymenu-secure
          cp /tmp/fm-public.pem ".tmp-fancymenu-secure/public-${GITHUB_RUN_ID}.pem"
          git config user.name "FancyMenu temporary builder"
          git config user.email "actions@users.noreply.github.com"
          git add ".tmp-fancymenu-secure/public-${GITHUB_RUN_ID}.pem"
          git commit -m "Publish ephemeral builder public key ${GITHUB_RUN_ID}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Wait for encrypted patch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='temp/fancymenu-emf-secure-build-20260925'
          PAYLOAD=".tmp-fancymenu-secure/payload-${GITHUB_RUN_ID}.enc"
          EKEY=".tmp-fancymenu-secure/key-${GITHUB_RUN_ID}.enc"
          IV=".tmp-fancymenu-secure/iv-${GITHUB_RUN_ID}.bin"
          for i in $(seq 1 180); do
            git fetch -q origin "$BRANCH"
            if git cat-file -e "origin/$BRANCH:$PAYLOAD" 2>/dev/null \
              && git cat-file -e "origin/$BRANCH:$EKEY" 2>/dev/null \
              && git cat-file -e "origin/$BRANCH:$IV" 2>/dev/null; then
              git show "origin/$BRANCH:$PAYLOAD" > /tmp/payload.enc
              git show "origin/$BRANCH:$EKEY" > /tmp/key.enc
              git show "origin/$BRANCH:$IV" > /tmp/iv.bin
              exit 0
            fi
            sleep 3
          done
          echo "Encrypted patch was not supplied in time" >&2
          exit 1

      - name: Decrypt patch
        shell: bash
        run: |
          set -euo pipefail
          openssl pkeyutl -decrypt -inkey /tmp/fm-private.pem -in /tmp/key.enc -out /tmp/aes.key \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          KEY_HEX=$(xxd -p -c 256 /tmp/aes.key)
          IV_HEX=$(xxd -p -c 256 /tmp/iv.bin)
          openssl enc -d -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" \
            -in /tmp/payload.enc -out /tmp/fancymenu.patch

      - name: Reconstruct FancyMenu fork
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/Keksuccino/FancyMenu.git fancymenu-src
          cd fancymenu-src
          git checkout -q 2e58c3e97241ae8ca1443399f94d52f28e7024a7
          git apply --check /tmp/fancymenu.patch
          git apply /tmp/fancymenu.patch

      - name: Build NeoForge 1.21.1
        working-directory: fancymenu-src
        run: |
          chmod +x gradlew
          ./gradlew :neoforge:build --stacktrace --no-daemon

      - name: Show outputs
        run: ls -lah fancymenu-src/neoforge/build/libs

      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: fancymenu-welite-emf-fix-neoforge-1.21.1
          path: |
            fancymenu-src/neoforge/build/libs/*.jar
            !fancymenu-src/neoforge/build/libs/*-sources.jar
            !fancymenu-src/neoforge/build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 3

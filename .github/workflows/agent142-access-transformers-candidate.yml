name: Agent142 AccessTransformers 10.0.1 candidate

on:
  push:
    branches:
      - agent142/access-transformers-incremental-10.0.1
    paths:
      - '.github/workflows/agent142-access-transformers-candidate.yml'
      - 'third_party/access-transformers-10.0.1/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  AT_UPSTREAM: https://github.com/neoforged/AccessTransformers.git
  AT_COMMIT: 8274f92c0f11ef1a95cc0d78c2ba3a15783e105c
  AT_VERSION: 10.0.1
  AT_FORK_VERSION: 10.0.1-agent142
  EXACT_PACK_TAG: exact-pack-2026-09-02-v1
  EXACT_PACK_ASSET: bootoptim-exact-pack.zip
  EXACT_PACK_SHA256: 7f586ecd90497a4d4aa1d2024af2643dbd64691864edbad9eb2ed40551c55639
  MCEF_JAVA_CEF_COMMIT: a78e832f9f13c2c688caea3d04d8b84fcd238d94
  MCEF_PLATFORM: linux_amd64
  DISPLAY: ':99'
  LIBGL_ALWAYS_SOFTWARE: 'true'
  GALLIUM_DRIVER: llvmpipe
  MESA_GL_VERSION_OVERRIDE: '4.6'
  MESA_GLSL_VERSION_OVERRIDE: '460'
  BOOTOPTIM_MCEF_MIRROR_PORT: '18765'
  BOOTOPTIM_PACK_JAVA_VERSION: '25'
  BOOTOPTIM_PACK_BASE_JVM_ARGS: |-
    -Xmx6G
    -XX:+UnlockExperimentalVMOptions
    -XX:+UseG1GC
    -XX:G1NewSizePercent=20
    -XX:G1ReservePercent=20
    -XX:MaxGCPauseMillis=50
    -XX:G1HeapRegionSize=32M
    -XX:ActiveProcessorCount=4
    -Dmcef.java.cef.commit=a78e832f9f13c2c688caea3d04d8b84fcd238d94

jobs:
  source-build-and-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4

      - name: Install display and archive tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 \
            libgtk-3-0 libnss3 libnspr4 libxss1 libasound2 \
            libatk1.0-0 libatk-bridge2.0-0 libdrm2 libgbm1 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libxfixes3 libx11-xcb1 libxshmfence1 libcups2 \
            libatspi2.0-0 libpango-1.0-0 libpangocairo-1.0-0 fonts-liberation unzip
          Xvfb "$DISPLAY" -screen 0 1280x720x24 -nolisten tcp > xvfb.log 2>&1 &
          for _ in $(seq 1 20); do
            if glxinfo -B > glxinfo.txt 2>&1; then break; fi
            sleep 0.25
          done
          grep -qi llvmpipe glxinfo.txt

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Remember JDK 17
        shell: bash
        run: echo "BOOTOPTIM_JDK17=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Setup compile JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Remember JDK 21
        shell: bash
        run: echo "BOOTOPTIM_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Verify published 10.0.1 source pin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent142-published
          base="https://maven.neoforged.net/releases/net/neoforged/accesstransformers/$AT_VERSION"
          curl --fail --location --retry 5 --retry-all-errors "$base/accesstransformers-$AT_VERSION.jar" -o .agent142-published/accesstransformers.jar
          curl --fail --location --retry 5 --retry-all-errors "$base/accesstransformers-$AT_VERSION.jar.sha256" -o .agent142-published/accesstransformers.jar.sha256
          expected=$(awk 'NR==1 {print $1}' .agent142-published/accesstransformers.jar.sha256)
          actual=$(sha256sum .agent142-published/accesstransformers.jar | awk '{print $1}')
          test "$actual" = "$expected"
          unzip -p .agent142-published/accesstransformers.jar META-INF/MANIFEST.MF | tr -d '\r' | tee published-at-manifest.txt
          grep -Eq '^Git-Commit: 8274f92([0-9a-f]*)?$' published-at-manifest.txt
          grep -Eq '^Implementation-Version: 10\.0\.1\+8274f92([0-9a-f]*)?$' published-at-manifest.txt

      - name: Build source fork and run upstream tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agent142-access-transformers .agent142-maven
          git init .agent142-access-transformers
          git -C .agent142-access-transformers remote add origin "$AT_UPSTREAM"
          git -C .agent142-access-transformers fetch --depth=1 origin "$AT_COMMIT"
          git -C .agent142-access-transformers checkout --detach FETCH_HEAD
          test "$(git -C .agent142-access-transformers rev-parse HEAD)" = "$AT_COMMIT"
          cmp third_party/access-transformers-10.0.1/LICENSE.txt .agent142-access-transformers/license.txt
          git -C .agent142-access-transformers apply "$GITHUB_WORKSPACE/third_party/access-transformers-10.0.1/patches/0001-incremental-per-file-transaction.patch"
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.paths=$BOOTOPTIM_JDK17,$BOOTOPTIM_JDK21" >> "$HOME/.gradle/gradle.properties"
          (cd .agent142-access-transformers && ./gradlew test :parser:jar --no-daemon --console=plain)
          parser_jar=$(find .agent142-access-transformers/parser/build/libs -maxdepth 1 -type f -name 'at-parser-*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$parser_jar"
          unzip -l "$parser_jar" | grep -q 'META-INF/LICENSE-neoforged-AccessTransformers.txt'
          dest="$GITHUB_WORKSPACE/.agent142-maven/dev/bootoptim/atfork/at-parser/$AT_FORK_VERSION"
          mkdir -p "$dest"
          cp "$parser_jar" "$dest/at-parser-$AT_FORK_VERSION.jar"
          cat > "$dest/at-parser-$AT_FORK_VERSION.pom" <<EOF
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>dev.bootoptim.atfork</groupId>
            <artifactId>at-parser</artifactId>
            <version>$AT_FORK_VERSION</version>
            <dependencies>
              <dependency>
                <groupId>org.slf4j</groupId>
                <artifactId>slf4j-api</artifactId>
                <version>2.0.9</version>
              </dependency>
            </dependencies>
          </project>
          EOF
          sha256sum "$dest/at-parser-$AT_FORK_VERSION.jar" | tee candidate-at-parser.sha256
          echo "BOOTOPTIM_AT_PARSER_OVERRIDE_REPO=$GITHUB_WORKSPACE/.agent142-maven" >> "$GITHUB_ENV"
          echo "BOOTOPTIM_AT_PARSER_OVERRIDE_VERSION=$AT_FORK_VERSION" >> "$GITHUB_ENV"

      - name: Activate single-module dependency replacement and build BootOptim
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle/init.d"
          cp third_party/access-transformers-10.0.1/override.init.gradle "$HOME/.gradle/init.d/agent142-at-parser.gradle"
          ./gradlew build --no-daemon --console=plain
          ./gradlew dependencyInsight --configuration runtimeClasspath --dependency at-parser --no-daemon --console=plain | tee at-parser-dependency.txt
          grep -q 'dev.bootoptim.atfork:at-parser:10.0.1-agent142' at-parser-dependency.txt
          if grep -E '^net\.neoforged\.accesstransformers:at-parser:10\.0\.1($| )' at-parser-dependency.txt; then
            echo 'Stock parser remains as a resolved component instead of only a substituted request.' >&2
            exit 1
          fi

      - name: Setup runtime JDK 25.0.4
        uses: actions/setup-java@v5
        with:
          java-version: '25.0.4'
          distribution: oracle

      - name: Remember JDK 25
        shell: bash
        run: echo "BOOTOPTIM_JDK25=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Download exact pack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .exact-pack-cache
          gh release download "$EXACT_PACK_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$EXACT_PACK_ASSET" --dir .exact-pack-cache --clobber
          test "$(sha256sum .exact-pack-cache/bootoptim-exact-pack.zip | awk '{print $1}')" = "$EXACT_PACK_SHA256"

      - name: Download pinned JCEF
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .mcef-jcef && mkdir -p .mcef-jcef
          base="https://mcef-download.cinemamod.com/java-cef-builds/$MCEF_JAVA_CEF_COMMIT"
          curl --fail --location --retry 5 --retry-all-errors "$base/${MCEF_PLATFORM}.tar.gz.sha256" -o ".mcef-jcef/${MCEF_PLATFORM}.tar.gz.sha256"
          curl --fail --location --retry 5 --retry-all-errors "$base/${MCEF_PLATFORM}.tar.gz" -o ".mcef-jcef/${MCEF_PLATFORM}.tar.gz"
          expected=$(awk 'NR==1 {print $1}' ".mcef-jcef/${MCEF_PLATFORM}.tar.gz.sha256")
          actual=$(sha256sum ".mcef-jcef/${MCEF_PLATFORM}.tar.gz" | awk '{print $1}')
          test "$actual" = "$expected"
          tar -xzf ".mcef-jcef/${MCEF_PLATFORM}.tar.gz" -C .mcef-jcef
          rm ".mcef-jcef/${MCEF_PLATFORM}.tar.gz"

      - name: Prepare fixture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/mcef-libraries .mcef-mirror .exact-pack-run run-pack-benchmark
          mkdir -p build/mcef-libraries
          cp -a .mcef-jcef/. build/mcef-libraries/
          chmod +x "build/mcef-libraries/$MCEF_PLATFORM/jcef_helper"
          mirror_root="$PWD/.mcef-mirror"
          mirror_dir="$mirror_root/java-cef-builds/$MCEF_JAVA_CEF_COMMIT"
          mkdir -p "$mirror_dir"
          cp ".mcef-jcef/${MCEF_PLATFORM}.tar.gz.sha256" "$mirror_dir/${MCEF_PLATFORM}.tar.gz.sha256"
          echo "BOOTOPTIM_MCEF_MIRROR_ROOT=$mirror_root" >> "$GITHUB_ENV"
          python scripts/exact-pack/prepare_fixture.py --zip .exact-pack-cache/bootoptim-exact-pack.zip --sha256 "$EXACT_PACK_SHA256" --extract .exact-pack-run --mcef-mirror-url "http://127.0.0.1:$BOOTOPTIM_MCEF_MIRROR_PORT"

      - name: Hosted exact-pack candidate smoke
        shell: bash
        run: |
          set -euo pipefail
          python scripts/exact-pack/run_startup.py --variant agent142-at-incremental-smoke --iteration 1 --timeout 1200 --rerun-tasks
          cat result.json
          cat resource-selection-check.json

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent142-access-transformers-candidate
          path: |
            published-at-manifest.txt
            candidate-at-parser.sha256
            at-parser-dependency.txt
            exact-pack-console.log
            result.json
            resource-selection-check.json
            run-pack-benchmark/logs/latest.log
            run-pack-benchmark/logs/bootoptim-startup.log
            xvfb.log
            glxinfo.txt
          if-no-files-found: ignore
          retention-days: 14

name: Agent134 CITResewn identity

on:
  push:
    branches:
      - agent134/citresewn-source-identity-20260911

permissions:
  contents: read

env:
  EXACT_PACK_TAG: exact-pack-2026-09-02-v1
  EXACT_PACK_ASSET: bootoptim-exact-pack.zip
  EXACT_PACK_SHA256: 7f586ecd90497a4d4aa1d2024af2643dbd64691864edbad9eb2ed40551c55639
  EXACT_PACK_CACHE_KEY: exact-pack-2026-09-02-v1-7f586ecd90497a4d-linux
  MODRINTH_VERSION_ID: JUnP9V1A

jobs:
  identity:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: .exact-pack-cache/bootoptim-exact-pack.zip
          key: ${{ env.EXACT_PACK_CACHE_KEY }}

      - name: Download fixture on cache miss
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .exact-pack-cache
          if [[ ! -f .exact-pack-cache/bootoptim-exact-pack.zip ]]; then
            gh release download "$EXACT_PACK_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$EXACT_PACK_ASSET" --dir .exact-pack-cache --clobber
          fi
          actual=$(sha256sum .exact-pack-cache/bootoptim-exact-pack.zip | awk '{print $1}')
          test "$actual" = "$EXACT_PACK_SHA256"

      - name: Fingerprint packed CITResewn without decompilation
        shell: bash
        run: |
          set -euo pipefail
          zip=.exact-pack-cache/bootoptim-exact-pack.zip
          entry=$(unzip -Z1 "$zip" | grep -E '/\(svfr\) CitResewn \{v0\} \[1\.21\.1\] \[MAINLOC\]\.jar$' | head -n1)
          test -n "$entry"
          test "$(unzip -Z1 "$zip" | grep -Ec '/\(svfr\) CitResewn \{v0\} \[1\.21\.1\] \[MAINLOC\]\.jar$')" = 1
          mkdir -p identity
          unzip -p "$zip" "$entry" > identity/exact-pack-citresewn.jar
          exact_sha256=$(sha256sum identity/exact-pack-citresewn.jar | awk '{print $1}')
          exact_sha512=$(sha512sum identity/exact-pack-citresewn.jar | awk '{print $1}')
          exact_size=$(stat -c %s identity/exact-pack-citresewn.jar)

          curl --fail --location --retry 3 "https://api.modrinth.com/v2/version/$MODRINTH_VERSION_ID" -o identity/modrinth-version.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('identity/modrinth-version.json').read_text())
          primary=next(f for f in data['files'] if f.get('primary'))
          Path('identity/modrinth-primary.txt').write_text(
              f"version_id={data['id']}\nversion_number={data['version_number']}\n"
              f"filename={primary['filename']}\nsize={primary['size']}\n"
              f"sha1={primary['hashes'].get('sha1','')}\nsha512={primary['hashes'].get('sha512','')}\n"
          )
          PY
          published_sha512=$(awk -F= '$1=="sha512"{print $2}' identity/modrinth-primary.txt)
          published_size=$(awk -F= '$1=="size"{print $2}' identity/modrinth-primary.txt)
          {
            echo "fixture_entry=$entry"
            echo "exact_sha256=$exact_sha256"
            echo "exact_sha512=$exact_sha512"
            echo "exact_size=$exact_size"
            cat identity/modrinth-primary.txt
            if [[ "$exact_sha512" = "$published_sha512" && "$exact_size" = "$published_size" ]]; then
              echo "official_modrinth_match=true"
            else
              echo "official_modrinth_match=false"
            fi
            echo "jar_entries_of_interest:"
            unzip -Z1 identity/exact-pack-citresewn.jar | grep -E '(^|/)(fabric\.mod\.json|LICENSE|AbstractFileResourcePackMixin\.class|citresewn\.mixins\.json)$' || true
            echo "fabric_mod_json:"
            unzip -p identity/exact-pack-citresewn.jar fabric.mod.json 2>/dev/null || true
          } | tee identity/citresewn-identity.txt
          rm -f identity/exact-pack-citresewn.jar

      - uses: actions/upload-artifact@v4
        with:
          name: agent134-citresewn-identity
          path: |
            identity/citresewn-identity.txt
            identity/modrinth-primary.txt
            identity/modrinth-version.json
          retention-days: 14

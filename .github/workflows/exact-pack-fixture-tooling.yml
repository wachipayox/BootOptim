name: Exact Pack Fixture Tooling

on:
  pull_request:
    paths:
      - 'tools/exact-pack/**'
      - '.github/workflows/exact-pack-fixture-tooling.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run fixture builder unit tests (no network)
        run: python -m unittest discover -s tools/exact-pack -p 'test_*.py' -v

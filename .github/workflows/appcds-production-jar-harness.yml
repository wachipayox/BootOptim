name: AppCDS production JAR-only harness

on:
  pull_request:
    branches:
      - agent/integration-current
    paths:
      - 'scripts/appcds/**'
      - '.github/workflows/appcds-production-jar-harness.yml'
      - 'bootstrap/**'
      - 'build.gradle'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appcds-production-jar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PACK_TAG: exact-pack-2026-09-02-v1
  EXACT_PACK_ASSET: bootoptim-exact-pack.zip
  EXACT_PACK_SHA256: 7f586ecd90497a4d4aa1d2024af2643dbd64691864edbad9eb2ed40551c55639
  EXACT_PACK_CACHE_KEY: exact-pack-2026-09-02-v1-7f586ecd90497a4d-linux
  MCEF_JAVA_CEF_COMMIT: a78e832f9f13c2c688caea3d04d8b84fcd238d94
  MCEF_PLATFORM: linux_amd64
  MCEF_CACHE_KEY: mcef-jcef-a78e832f9f13c2c688caea3d04d8b84fcd238d94-linux-amd64-v1
  DISPLAY: ':99'
  LIBGL_ALWAYS_SOFTWARE: 'true'
  GALLIUM_DRIVER: llvmpipe
  MESA_GL_VERSION_OVERRIDE: '4.6'
  MESA_GLSL_VERSION_OVERRIDE: '460'
  BOOTOPTIM_MCEF_MIRROR_PORT: '18765'

jobs:
  production-jar-cds-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install software display and CEF runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 \
            libgtk-3-0 libnss3 libnspr4 libxss1 libasound2 \
            libatk1.0-0 libatk-bridge2.0-0 libdrm2 libgbm1 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libxfixes3 libx11-xcb1 libxshmfence1 libcups2 \
            libatspi2.0-0 libpango-1.0-0 libpangocairo-1.0-0 \
            fonts-liberation
          Xvfb "$DISPLAY" -screen 0 1280x720x24 -nolisten tcp > xvfb.log 2>&1 &
          echo $! > xvfb.pid
          sleep 2
          glxinfo -B | tee glxinfo.txt
          grep -qi 'llvmpipe' glxinfo.txt

      - name: Setup compile JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Remember JDK 21
        shell: bash
        run: echo "BOOTOPTIM_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Setup Oracle runtime JDK 25.0.4
        uses: actions/setup-java@v5
        with:
          java-version: '25.0.4'
          distribution: oracle

      - name: Remember JDK 25
        shell: bash
        run: echo "BOOTOPTIM_JDK25=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Pin Gradle toolchains
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.paths=$BOOTOPTIM_JDK21,$BOOTOPTIM_JDK25" >> "$HOME/.gradle/gradle.properties"

      - name: Restore exact-pack ZIP cache
        id: pack-cache
        uses: actions/cache@v4
        with:
          path: .exact-pack-cache/bootoptim-exact-pack.zip
          key: ${{ env.EXACT_PACK_CACHE_KEY }}

      - name: Download pinned exact-pack release asset
        if: steps.pack-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .exact-pack-cache
          gh release download "$EXACT_PACK_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$EXACT_PACK_ASSET" \
            --dir .exact-pack-cache \
            --clobber

      - name: Verify exact-pack fixture
        shell: bash
        run: |
          set -euo pipefail
          actual=$(sha256sum .exact-pack-cache/bootoptim-exact-pack.zip | awk '{print $1}')
          test "$actual" = "$EXACT_PACK_SHA256"
          echo "fixture_sha256=$actual"

      - name: Restore pinned Linux JCEF cache
        id: mcef-cache
        uses: actions/cache@v4
        with:
          path: .mcef-jcef
          key: ${{ env.MCEF_CACHE_KEY }}

      - name: Download and verify pinned Linux JCEF
        if: steps.mcef-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .mcef-jcef
          mkdir -p .mcef-jcef
          base="https://mcef-download.cinemamod.com/java-cef-builds/$MCEF_JAVA_CEF_COMMIT"
          checksum=.mcef-jcef/${MCEF_PLATFORM}.tar.gz.sha256
          archive=.mcef-jcef/${MCEF_PLATFORM}.tar.gz
          curl --fail --location --retry 5 --retry-all-errors "$base/${MCEF_PLATFORM}.tar.gz.sha256" -o "$checksum"
          curl --fail --location --retry 5 --retry-all-errors "$base/${MCEF_PLATFORM}.tar.gz" -o "$archive"
          expected=$(tr -d '\r' < "$checksum" | awk 'NR==1 {print $1}')
          actual=$(sha256sum "$archive" | awk '{print $1}')
          test -n "$expected"
          test "$actual" = "$expected"
          tar -xzf "$archive" -C .mcef-jcef
          rm -f "$archive"
          test -f ".mcef-jcef/$MCEF_PLATFORM/jcef_helper"

      - name: Build distributable BootOptim bootstrap
        shell: bash
        run: ./gradlew build --no-daemon --console=plain

      - name: Select packaged bootstrap JarJar artifact
        shell: python
        run: |
          import os
          import zipfile
          from pathlib import Path

          candidates = []
          for path in sorted(Path('bootstrap/build/libs').glob('*.jar')):
              try:
                  with zipfile.ZipFile(path) as archive:
                      names = set(archive.namelist())
                      manifest = archive.read('META-INF/MANIFEST.MF').decode('utf-8', 'replace')
                  if 'META-INF/jarjar/metadata.json' in names and 'FMLModType: LIBRARY' in manifest.replace('\r\n', '\n'):
                      candidates.append(path.resolve())
              except (KeyError, zipfile.BadZipFile):
                  pass
          if len(candidates) != 1:
              raise SystemExit(f'Expected exactly one packaged bootstrap JarJar artifact, got {candidates}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'BOOTOPTIM_DISTRIBUTABLE={candidates[0]}\n')
          print(candidates[0])

      - name: Prepare isolated exact-pack production fixture
        shell: bash
        run: |
          set -euo pipefail
          python scripts/exact-pack/prepare_fixture.py \
            --zip .exact-pack-cache/bootoptim-exact-pack.zip \
            --sha256 "$EXACT_PACK_SHA256" \
            --extract .appcds-exact-pack-run \
            --mcef-mirror-url "http://127.0.0.1:$BOOTOPTIM_MCEF_MIRROR_PORT"
          cp "$BOOTOPTIM_PACK_DIR/options.txt" .appcds-options-reference.txt
          rm -rf "$BOOTOPTIM_PACK_DIR/mods/mcef-libraries/$MCEF_PLATFORM"
          mkdir -p "$BOOTOPTIM_PACK_DIR/mods/mcef-libraries"
          cp -a ".mcef-jcef/$MCEF_PLATFORM" "$BOOTOPTIM_PACK_DIR/mods/mcef-libraries/$MCEF_PLATFORM"
          chmod +x "$BOOTOPTIM_PACK_DIR/mods/mcef-libraries/$MCEF_PLATFORM/jcef_helper"
          mirror_dir="$PWD/.mcef-mirror/java-cef-builds/$MCEF_JAVA_CEF_COMMIT"
          mkdir -p "$mirror_dir"
          cp ".mcef-jcef/${MCEF_PLATFORM}.tar.gz.sha256" "$mirror_dir/${MCEF_PLATFORM}.tar.gz.sha256"

      - name: Write pinned benchmark JVM arguments
        shell: bash
        run: |
          cat > .appcds-base-jvm.args <<'EOF'
          -Xmx6G
          -XX:+UnlockExperimentalVMOptions
          -XX:+UseG1GC
          -XX:G1NewSizePercent=20
          -XX:G1ReservePercent=20
          -XX:MaxGCPauseMillis=50
          -XX:G1HeapRegionSize=32M
          -XX:ActiveProcessorCount=4
          -Dmcef.java.cef.commit=a78e832f9f13c2c688caea3d04d8b84fcd238d94
          EOF

      - name: Harness unit/self tests
        shell: bash
        run: python scripts/appcds/production_jar_harness.py self-test

      - name: Run production JAR-only archive generation and fresh-process consumption smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server "$BOOTOPTIM_MCEF_MIRROR_PORT" --bind 127.0.0.1 --directory .mcef-mirror > .mcef-mirror.log 2>&1 &
          mirror_pid=$!
          trap 'kill "$mirror_pid" 2>/dev/null || true' EXIT
          python scripts/appcds/production_jar_harness.py run \
            --repo . \
            --workspace .appcds-production \
            --pack "$BOOTOPTIM_PACK_DIR" \
            --java "$BOOTOPTIM_JDK25/bin/java" \
            --bootoptim-jar "$BOOTOPTIM_DISTRIBUTABLE" \
            --bootoptim-version 0.1.0 \
            --options-reference .appcds-options-reference.txt \
            --jvm-args-file .appcds-base-jvm.args \
            --fixture-sha256 "$EXACT_PACK_SHA256" \
            --minecraft-version 1.21.1 \
            --neoforge-version 21.1.248 \
            --timeout 1200
          kill "$mirror_pid" 2>/dev/null || true
          trap - EXIT

      - name: Prove no archive is published as a workflow artifact
        if: always()
        shell: bash
        run: rm -f .appcds-production/evidence/*.jsa

      - name: Upload JAR-only CDS evidence (archive excluded)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appcds-production-jar-evidence
          if-no-files-found: warn
          path: |
            .appcds-production/evidence/*.json
            .appcds-production/evidence/*.log
            .appcds-production/evidence/ordered-classpath.txt
            .appcds-production/launcher/installer/install-client.log
            .mcef-mirror.log
            glxinfo.txt
            xvfb.log

name: Agent144 AccessTransformers exact-topology candidate

on:
  push:
    branches: [agent144/access-transformers-exact-topology-10.0.1]
    paths:
      - '.github/workflows/agent144-access-transformers-exact-topology.yml'
      - 'at-incremental-contract/**'
      - 'third_party/access-transformers-10.0.1/**'
      - 'scripts/agent144/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  AT_COMMIT: 139da711070c67f7e62cc20ea43507aa216cc8c6
  AT_FORK_VERSION: 10.0.1-agent144
  EXACT_PACK_TAG: exact-pack-2026-09-02-v1
  EXACT_PACK_ASSET: bootoptim-exact-pack.zip
  EXACT_PACK_SHA256: 7f586ecd90497a4d4aa1d2024af2643dbd64691864edbad9eb2ed40551c55639
  MCEF_JAVA_CEF_COMMIT: a78e832f9f13c2c688caea3d04d8b84fcd238d94
  MCEF_PLATFORM: linux_amd64
  DISPLAY: ':99'
  LIBGL_ALWAYS_SOFTWARE: 'true'
  GALLIUM_DRIVER: llvmpipe
  MESA_GL_VERSION_OVERRIDE: '4.6'
  MESA_GLSL_VERSION_OVERRIDE: '460'
  BOOTOPTIM_MCEF_MIRROR_PORT: '18765'
  BOOTOPTIM_PACK_JAVA_VERSION: '25'
  BOOTOPTIM_PACK_BASE_JVM_ARGS: |-
    -Xmx6G
    -XX:+UnlockExperimentalVMOptions
    -XX:+UseG1GC
    -XX:G1NewSizePercent=20
    -XX:G1ReservePercent=20
    -XX:MaxGCPauseMillis=50
    -XX:G1HeapRegionSize=32M
    -XX:ActiveProcessorCount=4
    -Dmcef.java.cef.commit=a78e832f9f13c2c688caea3d04d8b84fcd238d94

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - name: Record JDK 21
        run: echo "BOOTOPTIM_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: gradle/actions/setup-gradle@v4
        with: {cache-read-only: true}
      - name: Run PR 277 stock/reference contract
        run: ./gradlew -p at-incremental-contract test --no-daemon --console=plain

      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Verify exact source and build candidate
        run: bash scripts/agent144/build_at_candidate.sh

      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - name: Prove single root-module replacement and build BootOptim
        shell: bash
        run: |
          set -euo pipefail
          export BOOTOPTIM_AT_OVERRIDE_REPO="$GITHUB_WORKSPACE/candidate-maven"
          export BOOTOPTIM_AT_OVERRIDE_VERSION="$AT_FORK_VERSION"
          echo "BOOTOPTIM_AT_OVERRIDE_REPO=$BOOTOPTIM_AT_OVERRIDE_REPO" >> "$GITHUB_ENV"
          echo "BOOTOPTIM_AT_OVERRIDE_VERSION=$BOOTOPTIM_AT_OVERRIDE_VERSION" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.gradle/init.d"
          cp third_party/access-transformers-10.0.1/override.init.gradle "$HOME/.gradle/init.d/agent144-at-override.gradle"
          cp third_party/access-transformers-10.0.1/verify-replacement.init.gradle "$HOME/.gradle/init.d/agent144-at-verify.gradle"
          ./gradlew agent144VerifyAtResolution --no-daemon --console=plain | tee source-evidence/resolution-gate.txt
          ./gradlew build --no-daemon --console=plain

      - uses: actions/setup-java@v5
        with: {distribution: oracle, java-version: '25.0.4'}
      - name: Configure Java toolchains
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.paths=$BOOTOPTIM_JDK21,$JAVA_HOME" >> "$HOME/.gradle/gradle.properties"
      - name: Prepare exact pack and hosted graphics
        env: {GH_TOKEN: '${{ github.token }}'}
        run: bash scripts/agent144/prepare_hosted_pack.sh
      - name: Hosted candidate smoke and runtime class-source gate
        env:
          BOOTOPTIM_PACK_EXTRA_JVM_ARGS: -Xlog:class+load=info
        shell: bash
        run: |
          set -euo pipefail
          python scripts/exact-pack/run_startup.py --variant agent144-smoke --iteration 1 --timeout 1200 --rerun-tasks
          grep -E 'net\.neoforged\.accesstransformer\.parser\.AccessTransformerList.*source:.*accesstransformers-10\.0\.1-agent144\.jar' exact-pack-console.log | tee source-evidence/runtime-class-source.txt
          test "$(grep -Ec 'net\.neoforged\.accesstransformer\.parser\.AccessTransformerList.*source:' exact-pack-console.log)" -eq 1
          cat result.json
          cat resource-selection-check.json
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent144-source-smoke-evidence
          path: |
            source-evidence
            result.json
            resource-selection-check.json
            exact-pack-console.log
            run-pack-benchmark/logs/latest.log
            run-pack-benchmark/logs/bootoptim-startup.log
            .agent144-upstream/build/test-results/test
            glxinfo.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload candidate repository for A/B
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: agent144-candidate-maven
          path: candidate-maven
          if-no-files-found: error
          retention-days: 3

  ab:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        variant: [control, candidate]
        iteration: [1, 2, 3]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: agent144-candidate-maven, path: candidate-maven}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - name: Record JDK 21
        run: echo "BOOTOPTIM_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: gradle/actions/setup-gradle@v4
        with: {cache-read-only: true}
      - name: Select exact dependency graph
        if: matrix.variant == 'candidate'
        shell: bash
        run: |
          set -euo pipefail
          test -f "candidate-maven/dev/bootoptim/atfork/accesstransformers/$AT_FORK_VERSION/accesstransformers-$AT_FORK_VERSION.jar"
          export BOOTOPTIM_AT_OVERRIDE_REPO="$GITHUB_WORKSPACE/candidate-maven"
          export BOOTOPTIM_AT_OVERRIDE_VERSION="$AT_FORK_VERSION"
          echo "BOOTOPTIM_AT_OVERRIDE_REPO=$BOOTOPTIM_AT_OVERRIDE_REPO" >> "$GITHUB_ENV"
          echo "BOOTOPTIM_AT_OVERRIDE_VERSION=$BOOTOPTIM_AT_OVERRIDE_VERSION" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.gradle/init.d"
          cp third_party/access-transformers-10.0.1/override.init.gradle "$HOME/.gradle/init.d/agent144-at-override.gradle"
          cp third_party/access-transformers-10.0.1/verify-replacement.init.gradle "$HOME/.gradle/init.d/agent144-at-verify.gradle"
          ./gradlew agent144VerifyAtResolution --no-daemon --console=plain
      - uses: actions/setup-java@v5
        with: {distribution: oracle, java-version: '25.0.4'}
      - name: Configure Java toolchains
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.paths=$BOOTOPTIM_JDK21,$JAVA_HOME" >> "$HOME/.gradle/gradle.properties"
      - name: Prepare exact pack and hosted graphics
        env: {GH_TOKEN: '${{ github.token }}'}
        run: bash scripts/agent144/prepare_hosted_pack.sh
      - name: Fresh-VM exact-pack arm
        run: python scripts/exact-pack/run_startup.py --variant '${{ matrix.variant }}' --iteration '${{ matrix.iteration }}' --timeout 1200 --rerun-tasks
      - name: Upload A/B result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent144-ab-${{ matrix.variant }}-${{ matrix.iteration }}
          path: |
            result.json
            resource-selection-check.json
            exact-pack-console.log
            run-pack-benchmark/logs/latest.log
            run-pack-benchmark/logs/bootoptim-startup.log
          if-no-files-found: ignore
          retention-days: 14

  aggregate:
    needs: ab
    if: needs.ab.result != 'skipped'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'agent144-ab-*', path: ab-results}
      - name: Aggregate and require complete 3+3
        shell: bash
        run: |
          set -euo pipefail
          python scripts/exact-pack/summarize_startup.py aggregate --results-dir ab-results --output agent144-ab-summary.md --json-output agent144-ab-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in Path('ab-results').rglob('result.json')]
          counts={v:sum(r.get('variant')==v for r in rows) for v in ('control','candidate')}
          if counts != {'control':3,'candidate':3}: raise SystemExit(f'incomplete A/B: {counts}')
          if any(r.get('bootoptim_mixin_errors') for r in rows): raise SystemExit('Mixin errors in A/B')
          print('AGENT144_AB_COUNTS', counts)
          PY
          cat agent144-ab-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: agent144-ab-summary
          path: |
            agent144-ab-summary.md
            agent144-ab-summary.json
          retention-days: 14

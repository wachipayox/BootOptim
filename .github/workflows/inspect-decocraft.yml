name: Inspect Decocraft

on:
  pull_request:
    branches:
      - agent/integration-current
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact Decocraft 3.0.11 jar
        run: |
          curl -fL --retry 3 'https://cdn.modrinth.com/data/IZJSgKZe/versions/Z8xm2POI/decocraft-3.0.11-1.21.1-neoforge.jar' -o /tmp/decocraft.jar
          sha256sum /tmp/decocraft.jar
          unzip -l /tmp/decocraft.jar | grep 'com/razz/decocraft/models/bbmodel/' | head -100

      - name: Decompile BBGeometry
        run: |
          javap -classpath /tmp/decocraft.jar -c -p -s 'com.razz.decocraft.models.bbmodel.BBModelGeometryLoader$BBGeometry'
          javap -classpath /tmp/decocraft.jar -c -p -s 'com.razz.decocraft.models.bbmodel.BBModelGeometryLoader'
          javap -classpath /tmp/decocraft.jar -c -p -s 'com.razz.decocraft.models.bbmodel.BBModel'

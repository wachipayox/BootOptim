name: Inspect FancyMenu Source

on:
  pull_request:
    branches: [ agent/integration-current ]

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch FancyMenu 3.9.0 Mojmap sources
        shell: bash
        run: |
          set -euo pipefail
          url='https://cdn.modrinth.com/data/Wq5SjeWM/versions/ERSQlY78/sources_fancymenu_neoforge_3.9.0_MC_1.21.1.jar'
          curl -L --fail --retry 3 "$url" -o fancymenu-sources.jar
          echo '=== MATCHING FILES ==='
          jar tf fancymenu-sources.jar | grep -E '(^|/)(ResourcePreLoader|ResourceHandler|ResourceHandlers|ImageResourceHandler|TextureResource|ResourceSource).*\.java$|util/resource/.+\.java$' | sort | tee matches.txt
          echo '=== SOURCE CONTENT ==='
          while IFS= read -r file; do
            case "$file" in
              *ResourcePreLoader.java|*ResourceHandler.java|*ResourceHandlers.java|*ImageResourceHandler.java|*ResourceSource.java)
                echo "===== $file ====="
                unzip -p fancymenu-sources.jar "$file"
                echo
                ;;
            esac
          done < matches.txt

name: Inspect FancyMenu Source

on:
  pull_request:
    branches: [ agent/integration-current ]

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch FancyMenu 3.9.0 Mojmap sources
        shell: bash
        run: |
          set -euo pipefail
          url='https://cdn.modrinth.com/data/Wq5SjeWM/versions/ERSQlY78/sources_fancymenu_neoforge_3.9.0_MC_1.21.1.jar'
          curl -L --fail --retry 3 "$url" -o fancymenu-sources.jar
          files=(
            'de/keksuccino/fancymenu/util/resource/Resource.java'
            'de/keksuccino/fancymenu/util/resource/ResourceSupplier.java'
            'de/keksuccino/fancymenu/util/resource/preload/ResourcePreLoader.java'
            'de/keksuccino/fancymenu/util/resource/resources/texture/ITexture.java'
            'de/keksuccino/fancymenu/util/resource/resources/texture/PngTexture.java'
            'de/keksuccino/fancymenu/customization/panorama/LocalTexturePanoramaRenderer.java'
            'de/keksuccino/fancymenu/customization/slideshow/ExternalTextureSlideshowRenderer.java'
          )
          echo '=== REQUESTED SOURCE CONTENT ==='
          for file in "${files[@]}"; do
            echo "===== $file ====="
            unzip -p fancymenu-sources.jar "$file"
            echo
          done
          echo '=== PNG / IMAGE FILE TYPE CANDIDATES ==='
          jar tf fancymenu-sources.jar | grep -E 'util/file/type/.+(Png|PNG|Image).+\.java$' | sort

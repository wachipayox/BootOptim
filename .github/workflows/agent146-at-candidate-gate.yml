name: Agent146 AT candidate semantic gate

on:
  push:
    branches:
      - agent146/at-touched-validation-candidate-20260913
    paths:
      - '.github/workflows/agent146-at-candidate-gate.yml'
      - 'scripts/agent146/**'
  pull_request:
    branches:
      - agent/integration-current
    paths:
      - '.github/workflows/agent146-at-candidate-gate.yml'
      - 'scripts/agent146/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Remember JDK 17
        shell: bash
        run: echo "BOOTOPTIM_JDK17=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build exact-source candidate and run direct Aa/BB/property gate
        shell: bash
        run: bash scripts/agent146/run_at_candidate_gate.sh

      - name: Fetch pinned oracle commits
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            agent145/at-inprocess-topology-oracle-20260913 \
            agent143/at-incremental-contract-20260913
          git cat-file -e 08060b4594a36d906d90f7762cdbb517a7a2f41e^{commit}
          git cat-file -e 6517d469f7722b0ced64400bbc0b9c3404ec0a2f^{commit}

      - name: Re-run PR 278 shared-identity topology oracle
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/agent145-oracle" 08060b4594a36d906d90f7762cdbb517a7a2f41e
          bash "$RUNNER_TEMP/agent145-oracle/scripts/agent145/run_at_topology_oracle.sh"

      - name: Run PR 277 full contract against stock path in candidate module
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Dboot_optim.atTouchedValidation=false
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/agent143-contract" 6517d469f7722b0ced64400bbc0b9c3404ec0a2f
          "$RUNNER_TEMP/agent143-contract/gradlew" \
            -p "$RUNNER_TEMP/agent143-contract/at-incremental-contract" \
            --init-script "$GITHUB_WORKSPACE/.agent146-at/init.gradle" \
            test --no-daemon

      - name: Run PR 277 full contract against touched-validation path
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Dboot_optim.atTouchedValidation=true
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/agent143-contract/gradlew" \
            -p "$RUNNER_TEMP/agent143-contract/at-incremental-contract" \
            --init-script "$GITHUB_WORKSPACE/.agent146-at/init.gradle" \
            clean test --no-daemon

      - name: Verify dependency substitution resolves candidate
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --init-script "$GITHUB_WORKSPACE/.agent146-at/init.gradle" \
            dependencyInsight --dependency accesstransformers --configuration runtimeClasspath \
            --no-daemon | tee .agent146-at/dependency-insight.txt
          grep -q 'net.neoforged:accesstransformers:10.0.1-agent146' .agent146-at/dependency-insight.txt

      - name: Upload semantic/provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent146-at-candidate-evidence
          path: |
            .agent146-at/evidence.txt
            .agent146-at/module.txt
            .agent146-at/manifest.txt
            .agent146-at/dependency-insight.txt
          if-no-files-found: ignore
          retention-days: 30

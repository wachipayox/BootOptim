import org.gradle.api.tasks.JavaExec

// Diagnostic/tooling-only source set injected by -I. Nothing here changes the
// packaged BootOptim runtime or normal Gradle lifecycle.
gradle.afterProject { project, state ->
    if (project != gradle.rootProject || state.failure != null) {
        return
    }

    def sourceSets = project.extensions.findByName('sourceSets')
    if (sourceSets == null || sourceSets.findByName('modelReplay') != null) {
        return
    }

    def main = sourceSets.getByName('main')
    def replay = sourceSets.create('modelReplay')
    replay.java.srcDir(project.file('src/modelReplay/java'))
    replay.resources.srcDir(project.file('src/modelReplay/resources'))
    replay.compileClasspath = project.files(main.output, main.compileClasspath)
    replay.runtimeClasspath = project.files(replay.output, replay.compileClasspath, main.runtimeClasspath)

    project.tasks.register('modelReplaySelfTest', JavaExec) {
        group = 'verification'
        description = 'Runs the proven pre-parent real BlockModel headless smoke test.'
        dependsOn replay.classesTaskName
        classpath = replay.runtimeClasspath
        mainClass.set('dev.wachipayox.bootoptim.replay.model.ModelClassReplaySelfTest')
    }

    project.tasks.register('modelReplayBootstrapBoundary', JavaExec) {
        group = 'verification'
        description = 'Reproduces the clean-JavaExec NeoForge LoadingModList bootstrap blocker.'
        dependsOn replay.classesTaskName
        classpath = replay.runtimeClasspath
        mainClass.set('dev.wachipayox.bootoptim.replay.model.ModelClassReplayLauncher')
    }
}

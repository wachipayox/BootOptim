plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

evaluationDependsOn(':bootstrap')

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
    // Agent 94 diagnostic-only launcher replacement. The workflow stages a Maven repository
    // containing the exact upstream GAV cpw.mods:modlauncher:11.0.5 with the forked JAR and
    // upstream-generated POM. exclusiveContent is important: when enabled, Gradle is forbidden
    // from resolving that module from the normal NeoForge repositories, so stock and fork cannot
    // coexist through repository fallback. No environment variable means normal production/dev resolution.
    var forkRepo = providers.environmentVariable('BOOTOPTIM_ML_FORK_REPO')
    if (forkRepo.isPresent()) {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'bootOptimAgent94ModLauncherFork'
                    url = uri(forkRepo.get())
                    metadataSources {
                        mavenPom()
                        artifact()
                    }
                }
            }
            filter {
                includeModule('cpw.mods', 'modlauncher')
            }
        }
    }

    // Agent 94 diagnostic-only Mixin replacement. Same principle as the ModLauncher lane:
    // the exact Fabric Mixin GAV is resolved exclusively from the staged probe repository,
    // so the diagnostic artifact replaces rather than coexists with the stock module/service JAR.
    var mixinForkRepo = providers.environmentVariable('BOOTOPTIM_MIXIN_FORK_REPO')
    if (mixinForkRepo.isPresent()) {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'bootOptimAgent94MixinFork'
                    url = uri(mixinForkRepo.get())
                    metadataSources {
                        mavenPom()
                        artifact()
                    }
                }
            }
            filter {
                includeModule('net.fabricmc', 'sponge-mixin')
            }
        }
    }
}

var packBenchmarkDirectory = project.file('run-pack-benchmark')
var externalPackDirectory = providers.gradleProperty('bootoptimPackDir')
        .orElse(providers.environmentVariable('BOOTOPTIM_PACK_DIR'))
var packBenchmarkJavaVersion = providers.environmentVariable('BOOTOPTIM_PACK_JAVA_VERSION')
var packBenchmarkBaseJvmArgs = providers.environmentVariable('BOOTOPTIM_PACK_BASE_JVM_ARGS')
var packBenchmarkExtraJvmArgs = providers.environmentVariable('BOOTOPTIM_PACK_EXTRA_JVM_ARGS')
var connectorCleanMinecraft = project.file('build/createCleanArtifact/minecraft-renamed.jar')

var prepareBootstrapRunOutputs = tasks.register('prepareBootstrapRunOutputs') {
    dependsOn ':bootstrap:classes'
}

var preparePackBenchmark = tasks.register('preparePackBenchmark', Sync) {
    into packBenchmarkDirectory

    from({
        if (!externalPackDirectory.isPresent()) {
            throw new GradleException('Set -PbootoptimPackDir=/path/to/pack or BOOTOPTIM_PACK_DIR before running the pack benchmark.')
        }
        var source = project.file(externalPackDirectory.get())
        if (!source.isDirectory()) {
            throw new GradleException("BootOptim pack directory does not exist: ${source}")
        }
        return source
    }) {
        include 'mods/**'
        include 'config/**'
        include 'defaultconfigs/**'
        include 'automodpack/**'
        include 'resourcepacks/**'
        include 'shaderpacks/**'
        include 'kubejs/**'
        include 'scripts/**'
        include 'paxi/**'
        include 'openloader/**'
        include 'global_packs/**'
        include 'fancymenu_data/**'
        include 'options.txt'
    }

    doLast { task ->
        var modsDirectory = new File(task.destinationDir, 'mods')
        if (!modsDirectory.isDirectory()) {
            throw new GradleException('Benchmark pack must contain a mods/ directory.')
        }

        var modJars = (modsDirectory.listFiles() ?: [] as File[]).findAll { file ->
            file.isFile() && file.name.toLowerCase(Locale.ROOT).endsWith('.jar')
        }
        var existingBootOptim = modJars.findAll { file ->
            var lower = file.name.toLowerCase(Locale.ROOT)
            lower.contains('bootoptim') || lower.contains('boot_optim')
        }
        if (!existingBootOptim.isEmpty()) {
            throw new GradleException("Remove BootOptim from the source pack before benchmarking; the dev build is injected separately: ${existingBootOptim*.name}")
        }

        task.logger.lifecycle('Prepared BootOptim pack benchmark with {} mod JARs', modJars.size())
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    additionalMinecraftArtifacts.put('vanillaDeobfuscated', connectorCleanMinecraft)

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        benchmarkClient {
            client()
            gameDirectory = project.file('run-benchmark')
            systemProperty 'boot_optim.profileStartup', 'true'
            systemProperty 'boot_optim.benchmark.exitOnTitle', 'true'
        }

        packBenchmarkClient {
            client()
            gameDirectory = packBenchmarkDirectory
            systemProperty 'boot_optim.profileStartup', 'true'
            systemProperty 'boot_optim.benchmark.exitOnTitle', 'true'
            systemProperty 'connector.clean.path', connectorCleanMinecraft.absolutePath

            [packBenchmarkBaseJvmArgs, packBenchmarkExtraJvmArgs].each { argsProvider ->
                if (argsProvider.isPresent()) {
                    argsProvider.get().readLines()
                            .collect { it.trim() }
                            .findAll { !it.isEmpty() }
                            .each { jvmArgument it }
                }
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            taskBefore prepareBootstrapRunOutputs
            systemProperty 'boot_optim.debug', 'true'
            systemProperty 'boot_optim.version', project.mod_version
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        'boot_optim_bootstrap' {
            sourceSet(project(':bootstrap').sourceSets.main)
        }
    }
}

tasks.named('runPackBenchmarkClient').configure {
    dependsOn preparePackBenchmark

    if (packBenchmarkJavaVersion.isPresent()) {
        var requestedJavaVersion = Integer.parseInt(packBenchmarkJavaVersion.get())
        javaLauncher.set(javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(requestedJavaVersion)
        })
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    manifest {
        attributes('Implementation-Version': project.version)
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

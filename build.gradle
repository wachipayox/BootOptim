plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

evaluationDependsOn(':bootstrap')

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
}

var packBenchmarkDirectory = project.file('run-pack-benchmark')
var externalPackDirectory = providers.gradleProperty('bootoptimPackDir')
        .orElse(providers.environmentVariable('BOOTOPTIM_PACK_DIR'))

var preparePackBenchmark = tasks.register('preparePackBenchmark', Sync) {
    into packBenchmarkDirectory

    from({
        if (!externalPackDirectory.isPresent()) {
            throw new GradleException('Set -PbootoptimPackDir=/path/to/pack or BOOTOPTIM_PACK_DIR before running the pack benchmark.')
        }
        var source = project.file(externalPackDirectory.get())
        if (!source.isDirectory()) {
            throw new GradleException("BootOptim pack directory does not exist: ${source}")
        }
        return source
    }) {
        include 'mods/**'
        include 'config/**'
        include 'defaultconfigs/**'
        // These locations can materially affect pre-ModLauncher or initial resource loading.
        include 'automodpack/**'
        include 'resourcepacks/**'
        include 'shaderpacks/**'
        include 'options.txt'
    }

    doLast {
        var modsDirectory = new File(packBenchmarkDirectory, 'mods')
        if (!modsDirectory.isDirectory()) {
            throw new GradleException('Benchmark pack must contain a mods/ directory.')
        }

        var existingBootOptim = fileTree(modsDirectory) {
            include '*.jar'
        }.files.findAll { file ->
            var lower = file.name.toLowerCase(Locale.ROOT)
            lower.contains('bootoptim') || lower.contains('boot_optim')
        }
        if (!existingBootOptim.isEmpty()) {
            throw new GradleException("Remove BootOptim from the source pack before benchmarking; the dev build is injected separately: ${existingBootOptim*.name}")
        }

        logger.lifecycle('Prepared BootOptim pack benchmark with {} mod JARs from {}',
                fileTree(modsDirectory).matching { include '*.jar' }.files.size(),
                externalPackDirectory.get())
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        benchmarkClient {
            client()
            gameDirectory = project.file('run-benchmark')
            systemProperty 'boot_optim.profileStartup', 'true'
            systemProperty 'boot_optim.benchmark.exitOnTitle', 'true'
        }

        packBenchmarkClient {
            client()
            gameDirectory = packBenchmarkDirectory
            systemProperty 'boot_optim.profileStartup', 'true'
            systemProperty 'boot_optim.benchmark.exitOnTitle', 'true'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // Startup benchmarks must resemble production logging; DEBUG/registry logging can materially skew boot time.
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        // Keep the early transformation service on a distinct path in dev, mirroring the packaged wrapper.
        'boot_optim_bootstrap' {
            sourceSet(project(':bootstrap').sourceSets.main)
        }
    }
}

tasks.named('runPackBenchmarkClient').configure {
    dependsOn preparePackBenchmark
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

evaluationDependsOn(':bootstrap')

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
}

var packBenchmarkDirectory = project.file('run-pack-benchmark')
var externalPackDirectory = providers.gradleProperty('bootoptimPackDir')
        .orElse(providers.environmentVariable('BOOTOPTIM_PACK_DIR'))
var packBenchmarkJavaVersion = providers.environmentVariable('BOOTOPTIM_PACK_JAVA_VERSION')
var packBenchmarkBaseJvmArgs = providers.environmentVariable('BOOTOPTIM_PACK_BASE_JVM_ARGS')
var packBenchmarkExtraJvmArgs = providers.environmentVariable('BOOTOPTIM_PACK_EXTRA_JVM_ARGS')
var connectorCleanMinecraft = project.file('build/createCleanArtifact/minecraft-renamed.jar')

// IntelliJ launches the root project but MOD_CLASSES also points at the bootstrap subproject outputs.
// Keep the IDE before-run task in the root project (as ModDevGradle expects) and bridge to the
// bootstrap compile from there. This also makes Gradle run tasks safe on a clean checkout.
var prepareBootstrapRunOutputs = tasks.register('prepareBootstrapRunOutputs') {
    dependsOn ':bootstrap:classes'
}

var preparePackBenchmark = tasks.register('preparePackBenchmark', Sync) {
    into packBenchmarkDirectory

    from({
        if (!externalPackDirectory.isPresent()) {
            throw new GradleException('Set -PbootoptimPackDir=/path/to/pack or BOOTOPTIM_PACK_DIR before running the pack benchmark.')
        }
        var source = project.file(externalPackDirectory.get())
        if (!source.isDirectory()) {
            throw new GradleException("BootOptim pack directory does not exist: ${source}")
        }
        return source
    }) {
        include 'mods/**'
        include 'config/**'
        include 'defaultconfigs/**'
        // These locations can materially affect pre-ModLauncher or initial resource loading.
        include 'automodpack/**'
        include 'resourcepacks/**'
        include 'shaderpacks/**'
        include 'kubejs/**'
        include 'scripts/**'
        include 'paxi/**'
        include 'openloader/**'
        include 'global_packs/**'
        include 'fancymenu_data/**'
        include 'options.txt'
    }

    doLast { task ->
        var modsDirectory = new File(task.destinationDir, 'mods')
        if (!modsDirectory.isDirectory()) {
            throw new GradleException('Benchmark pack must contain a mods/ directory.')
        }

        var modJars = (modsDirectory.listFiles() ?: [] as File[]).findAll { file ->
            file.isFile() && file.name.toLowerCase(Locale.ROOT).endsWith('.jar')
        }
        var existingBootOptim = modJars.findAll { file ->
            var lower = file.name.toLowerCase(Locale.ROOT)
            lower.contains('bootoptim') || lower.contains('boot_optim')
        }
        if (!existingBootOptim.isEmpty()) {
            throw new GradleException("Remove BootOptim from the source pack before benchmarking; the dev build is injected separately: ${existingBootOptim*.name}")
        }

        task.logger.lifecycle('Prepared BootOptim pack benchmark with {} mod JARs', modJars.size())
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Sinytra Connector needs an unpatched/deobfuscated Minecraft artifact when it runs under ModDevGradle.
    // This mirrors the minimal setup from Sinytra Adapter's userdev plugin without making BootOptim depend on it.
    additionalMinecraftArtifacts.put('vanillaDeobfuscated', connectorCleanMinecraft)

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        benchmarkClient {
            client()
            gameDirectory = project.file('run-benchmark')
            systemProperty 'boot_optim.profileStartup', 'true'
            systemProperty 'boot_optim.benchmark.exitOnTitle', 'true'
        }

        packBenchmarkClient {
            client()
            gameDirectory = packBenchmarkDirectory
            systemProperty 'boot_optim.profileStartup', 'true'
            systemProperty 'boot_optim.benchmark.exitOnTitle', 'true'
            systemProperty 'connector.clean.path', connectorCleanMinecraft.absolutePath

            [packBenchmarkBaseJvmArgs, packBenchmarkExtraJvmArgs].each { argsProvider ->
                if (argsProvider.isPresent()) {
                    argsProvider.get().readLines()
                            .collect { it.trim() }
                            .findAll { !it.isEmpty() }
                            .each { jvmArgument it }
                }
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // The bootstrap source set is passed to FML through MOD_CLASSES instead of the run source set's
            // runtime classpath. On a clean checkout its output directories do not exist until this task runs.
            taskBefore prepareBootstrapRunOutputs

            // Every ModDev/IDE run is a debug environment: keep the lightweight startup report on there.
            systemProperty 'boot_optim.debug', 'true'
            systemProperty 'boot_optim.version', project.mod_version

            // Startup benchmarks must resemble production logging; DEBUG/registry logging can materially skew boot time.
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        // Keep the early transformation service on a distinct path in dev, mirroring the packaged wrapper.
        'boot_optim_bootstrap' {
            sourceSet(project(':bootstrap').sourceSets.main)
        }
    }
}

tasks.named('runPackBenchmarkClient').configure {
    dependsOn preparePackBenchmark

    if (packBenchmarkJavaVersion.isPresent()) {
        var requestedJavaVersion = Integer.parseInt(packBenchmarkJavaVersion.get())
        javaLauncher.set(javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(requestedJavaVersion)
        })
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    manifest {
        attributes('Implementation-Version': project.version)
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Execute the actual instruction-site transform against mod-like callbacks and fail-open shapes.
var strictPathContractClasses = layout.buildDirectory.dir('classes/strictPathTransformContract')
var compileStrictPathTransformContract = tasks.register('compileStrictPathTransformContract', JavaCompile) {
    dependsOn tasks.named('classes')
    source = files('tools/research/StrictPathSegmentTransformContract.java')
    classpath = sourceSets.main.runtimeClasspath
    destinationDirectory = strictPathContractClasses
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
}
var strictPathTransformContract = tasks.register('strictPathTransformContract', JavaExec) {
    dependsOn compileStrictPathTransformContract
    classpath = files(strictPathContractClasses) + sourceSets.main.runtimeClasspath
    mainClass = 'StrictPathSegmentTransformContract'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn strictPathTransformContract }

// Host-only contract for deferred Decocraft quarter-turn variants and compact snapshots (package-private access).
var decocraftLazyRotationsContractClasses = layout.buildDirectory.dir('classes/decocraftLazyRotationsContract')
var compileDecocraftLazyRotationsContract = tasks.register('compileDecocraftLazyRotationsContract', JavaCompile) {
    dependsOn tasks.named('classes')
    source = fileTree('tools/research/dev')
    classpath = sourceSets.main.runtimeClasspath
    destinationDirectory = decocraftLazyRotationsContractClasses
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
}
var decocraftLazyRotationsContract = tasks.register('decocraftLazyRotationsContract', JavaExec) {
    dependsOn compileDecocraftLazyRotationsContract
    classpath = files(decocraftLazyRotationsContractClasses) + sourceSets.main.runtimeClasspath
    mainClass = 'dev.wachipayox.bootoptim.optimization.client.DecocraftLazyRotationsContract'
    systemProperty 'boot_optim.decocraftLazyRotations', 'true'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn decocraftLazyRotationsContract }

// Host-only contract for the Decocraft compact-structure mechanisms; stand-in classes stay under tools/ and are never packaged.
var decocraftCompactContractClasses = layout.buildDirectory.dir('classes/decocraftCompactStructuresContract')
var compileDecocraftCompactStructuresContract = tasks.register('compileDecocraftCompactStructuresContract', JavaCompile) {
    dependsOn tasks.named('classes')
    source = files('tools/research/DecocraftCompactStructuresContract.java') + fileTree('tools/research/decocraft-fixture-src')
    classpath = sourceSets.main.runtimeClasspath
    destinationDirectory = decocraftCompactContractClasses
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
}
var decocraftCompactStructuresContract = tasks.register('decocraftCompactStructuresContract', JavaExec) {
    dependsOn compileDecocraftCompactStructuresContract
    classpath = files(decocraftCompactContractClasses) + sourceSets.main.runtimeClasspath
    mainClass = 'DecocraftCompactStructuresContract'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn decocraftCompactStructuresContract }
// Host-only contract for the Decocraft embedded-source String sharing.
var decocraftSourceStringsContractClasses = layout.buildDirectory.dir('classes/decocraftSourceStringsContract')
var compileDecocraftSourceStringsContract = tasks.register('compileDecocraftSourceStringsContract', JavaCompile) {
    dependsOn tasks.named('classes')
    source = files('tools/research/DecocraftSourceStringsContract.java')
    classpath = sourceSets.main.runtimeClasspath
    destinationDirectory = decocraftSourceStringsContractClasses
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
}
var decocraftSourceStringsContract = tasks.register('decocraftSourceStringsContract', JavaExec) {
    dependsOn compileDecocraftSourceStringsContract
    classpath = files(decocraftSourceStringsContractClasses) + sourceSets.main.runtimeClasspath
    mainClass = 'DecocraftSourceStringsContract'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn decocraftSourceStringsContract }

// Manual: ./gradlew verifyDecocraftContracts -PdecocraftJar=<installed Decocraft JAR> (not part of check; the JAR is only read).
var decocraftVerifyClasses = layout.buildDirectory.dir('classes/decocraftContractsVerify')
var compileDecocraftContractsVerify = tasks.register('compileDecocraftContractsVerify', JavaCompile) {
    dependsOn tasks.named('classes')
    source = files('tools/research/DecocraftContractsVerify.java')
    classpath = sourceSets.main.runtimeClasspath
    destinationDirectory = decocraftVerifyClasses
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.register('verifyDecocraftContracts', JavaExec) {
    dependsOn compileDecocraftContractsVerify
    classpath = files(decocraftVerifyClasses) + sourceSets.main.runtimeClasspath
    mainClass = 'DecocraftContractsVerify'
    args = [providers.gradleProperty('decocraftJar').getOrElse('')]
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

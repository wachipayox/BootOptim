plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

sourceSets {
    bootstrap {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

repositories {
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        benchmarkClient {
            client()
            gameDirectory = project.file('run-benchmark')
            systemProperty 'boot_optim.profileStartup', 'true'
            systemProperty 'boot_optim.benchmark.exitOnTitle', 'true'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // Startup benchmarks must resemble production logging; DEBUG/registry logging can materially skew boot time.
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    // Development runs use the core source set directly. The distributable jar wraps
    // this core as a Jar-in-Jar so the outer artifact can live in FML's SERVICE layer.
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    bootstrapImplementation.extendsFrom implementation
    bootstrapCompileOnly.extendsFrom compileOnly
    bootstrapAnnotationProcessor.extendsFrom annotationProcessor
}

dependencies {
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    archiveClassifier.set('core')
    manifest.attributes('Automatic-Module-Name': 'dev.wachipayox.bootoptim')
}

var bootstrapJar = tasks.register('bootstrapJar', Jar) {
    dependsOn tasks.named('jar')
    archiveClassifier.set('')
    from sourceSets.bootstrap.output
    from(tasks.named('jar', Jar).flatMap { it.archiveFile }) {
        into 'META-INF/jarjar'
        rename { "${mod_id}-${mod_version}-core.jar" }
    }
    manifest.attributes('Automatic-Module-Name': 'dev.wachipayox.bootoptim.bootstrap')
}

tasks.named('assemble').configure {
    dependsOn bootstrapJar
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact bootstrapJar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
